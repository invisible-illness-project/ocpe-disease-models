id: head-up-tilt
title: Supine baseline followed by passive 70 degree head-up tilt
scientific_note: Passive 70 degree tilt with a 30 second transition; ETCO2 remains at its reference unless explicitly supplied.
solver:
  sample_interval: 2.0
  max_step: 2.0
  rtol: 1.0e-7
  atol: 1.0e-8
segments:
  - {start: 0, end: 120, tilt_angle_deg: 0.0, exertion: 0.0, label: supine}
  - {start: 120, end: 600, tilt_angle_deg: 70.0, transition_duration: 30.0, exertion: 0.0, end_tidal_co2_mmHg: 40.0, label: passive-70-degree-tilt}

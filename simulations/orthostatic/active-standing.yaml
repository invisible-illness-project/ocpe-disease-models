id: active-standing
title: Active stand followed by sustained quiet standing
scientific_note: A three-second active transition with ten seconds of declared low-level muscle activity; activity magnitude is a protocol assumption, not a calibrated gait model.
solver: {sample_interval: 0.5, max_step: 0.5, rtol: 1.0e-7, atol: 1.0e-8}
segments:
  - {start: 0, end: 120, tilt_angle_deg: 0.0, exertion: 0.0, rhythmic_muscle_activity: 0.0, sustained_muscle_contraction: 0.0, end_tidal_co2_mmHg: 40.0, label: supine}
  - {start: 120, end: 130, tilt_angle_deg: 90.0, transition_duration: 3.0, exertion: 0.0, rhythmic_muscle_activity: 0.25, sustained_muscle_contraction: 0.25, end_tidal_co2_mmHg: 40.0, label: active-stand-transition}
  - {start: 130, end: 600, tilt_angle_deg: 90.0, exertion: 0.0, rhythmic_muscle_activity: 0.0, sustained_muscle_contraction: 0.0, end_tidal_co2_mmHg: 40.0, label: sustained-quiet-standing}

id: tilt-recovery
title: Orthostatic stress and supine cerebral-flow recovery
solver: {sample_interval: 2.0, max_step: 2.0, rtol: 1.0e-7, atol: 1.0e-8}
segments:
  - {start: 0, end: 120, upright: 0.0, exertion: 0.0, label: supine}
  - {start: 120, end: 600, upright: 1.0, exertion: 0.0, label: upright}
  - {start: 600, end: 1200, upright: 0.0, exertion: 0.0, label: supine-recovery}

id: tilt-recovery
title: Orthostatic stress and supine cerebral-flow recovery
solver: {sample_interval: 2.0, max_step: 2.0, rtol: 1.0e-7, atol: 1.0e-8}
segments:
  - {start: 0, end: 120, tilt_angle_deg: 0.0, exertion: 0.0, label: supine}
  - {start: 120, end: 600, tilt_angle_deg: 70.0, transition_duration: 30.0, exertion: 0.0, end_tidal_co2_mmHg: 40.0, label: passive-70-degree-tilt}
  - {start: 600, end: 1200, tilt_angle_deg: 0.0, transition_duration: 30.0, exertion: 0.0, end_tidal_co2_mmHg: 40.0, label: tilt-back-supine-recovery}

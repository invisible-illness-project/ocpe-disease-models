id: co2-recovery-persistent-pressure-reduction
title: CO2 recovery with persistent pressure reduction
scientific_note: ETCO2 returns to 40 mmHg while passive 70 degree tilt is maintained.
solver: {sample_interval: 1.0, max_step: 1.0, rtol: 1.0e-7, atol: 1.0e-8}
segments:
  - {start: 0, end: 120, tilt_angle_deg: 0.0, end_tidal_co2_mmHg: 40.0, label: supine-reference}
  - {start: 120, end: 600, tilt_angle_deg: 70.0, transition_duration: 30.0, end_tidal_co2_mmHg: 30.0, label: combined-reduction}
  - {start: 600, end: 1200, tilt_angle_deg: 70.0, end_tidal_co2_mmHg: 40.0, label: co2-recovery-persistent-pressure-reduction}

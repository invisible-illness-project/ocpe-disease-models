        value_range: {min: 0.0}
        x-executable-parameter: splanchnic_arterial_resistance
      - symbol: R_la0
        role: parameter
        label: Lower-limb arterial resistance (reference)
        unit: mm[Hg].s/mL
        nominal_value: 4.408163265306122
        value_range: {min: 0.0}
        x-executable-parameter: lower_limb_arterial_resistance
      - symbol: R_oa0
        role: parameter
        label: Other-systemic (residual) arterial resistance (reference)

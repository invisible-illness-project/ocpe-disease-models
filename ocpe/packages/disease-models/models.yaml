        label: Splanchnic hydrostatic height (lumped heart-to-bed)
        unit: cm
        nominal_value: 7.0
        value_range: {min: 0.0}
        x-executable-parameter: splanchnic_hydrostatic_height_cm
      - symbol: h_gl
        role: parameter
        label: Lower-limb hydrostatic height (lumped heart-to-bed)
        unit: cm
        nominal_value: 14.0
        value_range: {min: 0.0}

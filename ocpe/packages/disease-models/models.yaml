        unit: mm[Hg]
        nominal_value: 2.0
        value_range: {min: 0.0}
        x-executable-parameter: carotid_baroreflex_pressure_scale
      - symbol: w_ao
        role: parameter
        label: Aortic baroreflex integration weight
        unit: "1"
        nominal_value: 0.25
        value_range: {min: 0.0, max: 1.0}
        x-executable-parameter: aortic_baroreflex_weight
      - symbol: w_ca
        role: parameter

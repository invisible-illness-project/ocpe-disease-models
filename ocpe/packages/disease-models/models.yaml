        nominal_value: 0.0
        value_range: {min: 0.0, max: 1.0}
        x-executable-input: rhythmic_muscle_activity
      - symbol: A_s
        role: input
        label: Sustained muscle contraction
        description: Normalized sustained contraction impeding lower-limb venous return.
        unit: "1"
        nominal_value: 0.0
        value_range: {min: 0.0, max: 1.0}
        x-executable-input: sustained_muscle_contraction
      # ---------------------------------------------------------- auxiliaries
      - symbol: P_a
        role: auxiliary
        label: Arterial pressure
        unit: mm[Hg]
      - symbol: P_cv
        role: auxiliary
        label: Central venous pressure
        unit: mm[Hg]
        x-executable-output: central_venous_pressure
      - symbol: P_sv
        role: auxiliary
        label: Splanchnic venous pressure
        unit: mm[Hg]
        x-executable-output: splanchnic_venous_pressure
      - symbol: P_lv
        role: auxiliary
        label: Lower-limb venous pressure
        unit: mm[Hg]
        x-executable-output: lower_limb_venous_pressure
      - symbol: P_ov
        role: auxiliary
        label: Other-systemic (residual) venous pressure
        unit: mm[Hg]
        x-executable-output: other_systemic_venous_pressure
      - symbol: P_ao
        role: auxiliary
        label: Aortic baroreceptor pressure
        unit: mm[Hg]
        x-executable-output: aortic_baroreceptor_pressure
      - symbol: P_ca_s
        role: auxiliary
        label: Carotid sinus pressure
        unit: mm[Hg]
        x-executable-output: carotid_sinus_pressure
      - symbol: P_brain
        role: auxiliary
        label: Brain-level arterial pressure
        unit: mm[Hg]
        x-executable-output: brain_arterial_pressure
      - symbol: P_cpp
        role: auxiliary
        label: Cerebral perfusion pressure
        unit: mm[Hg]
        represents: ocpe:disease-models/cerebral-perfusion-pressure
        x-executable-output: cerebral_perfusion_pressure
      - symbol: R_sa
        role: auxiliary
        label: Effective splanchnic arterial resistance
        unit: mm[Hg].s/mL
        x-executable-output: splanchnic_arterial_resistance_effective
      - symbol: R_la
        role: auxiliary
        label: Effective lower-limb arterial resistance
        unit: mm[Hg].s/mL
        x-executable-output: lower_limb_arterial_resistance_effective
      - symbol: R_oa
        role: auxiliary
        label: Effective other-systemic arterial resistance
        unit: mm[Hg].s/mL
        x-executable-output: other_systemic_arterial_resistance_effective
      - symbol: R_lve
        role: auxiliary
        label: Effective lower-limb venous resistance
        unit: mm[Hg].s/mL
        x-executable-output: lower_limb_venous_resistance_effective
      - symbol: R_par
        role: auxiliary
        label: Effective parallel systemic arterial resistance (three beds)
        unit: mm[Hg].s/mL
        x-executable-output: systemic_resistance_effective
      - symbol: F_ct
        role: auxiliary
        label: Contractility factor
        unit: "1"
      - symbol: S_br
        role: auxiliary
        label: Baroreflex autonomic target
        unit: "1"
      - symbol: Q_h
        role: auxiliary
        label: Cardiac pump flow
        unit: mL/s
        x-executable-output: cardiac_output
      - symbol: Q_sa
        role: auxiliary
        label: Splanchnic arterial inflow
        unit: mL/s
        x-executable-output: splanchnic_arterial_flow
      - symbol: Q_la
        role: auxiliary
        label: Lower-limb arterial inflow
        unit: mL/s
        x-executable-output: lower_limb_arterial_flow
      - symbol: Q_oa
        role: auxiliary
        label: Other-systemic arterial inflow
        unit: mL/s
        x-executable-output: other_systemic_arterial_flow
      - symbol: Q_sys
        role: auxiliary
        label: Total systemic arterial outflow
        unit: mL/s
        x-executable-output: systemic_flow
      - symbol: Q_svr
        role: auxiliary
        label: Splanchnic venous return
        unit: mL/s
        x-executable-output: splanchnic_venous_return
      - symbol: Q_lvr
        role: auxiliary
        label: Lower-limb venous return (including muscle pump)
        unit: mL/s
        x-executable-output: lower_limb_venous_return
      - symbol: Q_ovr
        role: auxiliary
        label: Other-systemic venous return
        unit: mL/s
        x-executable-output: other_systemic_venous_return
      - symbol: Q_mp
        role: auxiliary
        label: Muscle pump flow
        unit: mL/s
        x-executable-output: muscle_pump_flow
      - symbol: Q_vr
        role: auxiliary
        label: Total venous return
        unit: mL/s
        x-executable-output: venous_return
      - symbol: CFI_p
        role: auxiliary
        label: Cerebral flow pressure target (autoregulation curve)
        unit: "1"
        x-executable-output: cerebral_pressure_target
      - symbol: F_co2
        role: auxiliary
        label: Bounded end-tidal-CO2 cerebral factor
        unit: "1"
        x-executable-output: cerebral_co2_factor
      - symbol: F_imp
        role: auxiliary
        label: Cerebral orthostatic impairment factor
        unit: "1"
        x-executable-output: cerebral_impairment_factor
      - symbol: CFI_t
        role: auxiliary
        label: Cerebral flow index target
        unit: "1"
        x-executable-output: cerebral_flow_target
      - symbol: X
        role: auxiliary
        label: Effective oxygen extraction fraction
        unit: "1"
        x-executable-output: oxygen_extraction
      # ------------------------------------------------------------- outputs
      - symbol: HR
        role: output
        label: Heart rate
        unit: "/min"
        represents: ocpe:disease-models/heart-rate
        x-executable-output: heart_rate
      - symbol: MAP
        role: output
        label: Mean arterial pressure
        unit: mm[Hg]
        represents: ocpe:disease-models/mean-arterial-pressure
        x-executable-output: mean_arterial_pressure
      - symbol: SV
        role: output
        label: Stroke volume
        unit: mL
        represents: ocpe:disease-models/stroke-volume
        x-executable-output: stroke_volume
      - symbol: CO
        role: output
        label: Cardiac output
        unit: L/min
        represents: ocpe:disease-models/cardiac-output
        x-executable-output: cardiac_output_l_min
      - symbol: CFI
        role: output
        label: Cerebral flow index
        description: >
          Time-integrated dynamic state (twelfth ODE state) exposed as an
          exchanged output; bounded by [0, 1.25] in the executable.
        unit: "1"
        represents: ocpe:disease-models/cerebral-flow-index
        nominal_value: 1.0
        value_range: {min: 0.0, max: 1.25}
        x-executable-output: cerebral_flow_index
        x-executable-state: cerebral_flow_index
      - symbol: MC
        role: output
        label: Metabolic capacity
        unit: "1"
        represents: ocpe:disease-models/metabolic-capacity
        x-executable-output: metabolic_capacity
      - symbol: PEM
        role: output
        label: PEM severity
        description: >
          Time-integrated dynamic state (phenomenological PEM cascade) exposed
          as an exchanged output.
        unit: "1"
        represents: ocpe:disease-models/pem-severity
        nominal_value: 0.0
        value_range: {min: 0.0, max: 1.0}
        x-executable-output: pem_severity
        x-executable-state: pem_severity
      - symbol: S_sym
        role: output
        label: Mean sympathetic state
        description: Mean of the cardiac and vascular sympathetic states.
        unit: "1"
        represents: ocpe:disease-models/sympathetic-activation
        x-executable-output: sympathetic_state
      - symbol: FC
        role: output
        label: Functional capacity
        description: Metabolic capacity weighted by relative oxygen extraction.
        unit: "1"
        x-executable-output: functional_capacity
    equations:
      # ---------------------------------------------------- compartment laws
      - id: eq_arterial_pressure
        form: algebraic
        label: Arterial pressure (linear stressed-volume law)
        expression_latex: "P_a = \\frac{V_a}{C_a}"
        inputs: [V_a]
        parameters: [C_a]
        outputs: [P_a]
      - id: eq_central_venous_pressure
        form: algebraic
        label: Central venous pressure
        expression_latex: "P_{cv} = \\frac{V_{cv}}{C_{cv}}"
        inputs: [V_cv]
        parameters: [C_cv]
        outputs: [P_cv]
      - id: eq_splanchnic_venous_pressure
        form: algebraic
        label: Splanchnic venous pressure
        expression_latex: "P_{sv} = \\frac{V_{sv}}{C_{sv}}"
        inputs: [V_sv]
        parameters: [C_sv]
        outputs: [P_sv]
      - id: eq_lower_limb_venous_pressure
        form: algebraic
        label: Lower-limb venous pressure
        expression_latex: "P_{lv} = \\frac{V_{lv}}{C_{lv}}"
        inputs: [V_lv]
        parameters: [C_lv]
        outputs: [P_lv]
      - id: eq_other_systemic_venous_pressure
        form: algebraic
        label: Other-systemic (residual) venous pressure
        expression_latex: "P_{ov} = \\frac{V_{ov}}{C_{ov}}"
        inputs: [V_ov]
        parameters: [C_ov]
        outputs: [P_ov]
      - id: eq_hydrostatic_correction
        form: algebraic
        label: Hydrostatic sine-angle correction for a lumped height h
        expression_latex: "\\Delta P_{hydro}(h) = 0.7356\\,\\mathrm{mmHg/cm}\\; h \\sin\\theta,\\quad \\theta \\in [0, 90^{\\circ}]"
        inputs: [theta]
        outputs: []
      - id: eq_other_systemic_resistance
        form: algebraic
        label: Other-systemic arterial resistance (vascular sympathetic modulation)
        expression_latex: "R_{oa} = R_{oa0}\\,\\big(1 + g_{or}\\,(S_v - \\tfrac{1}{2})\\big)"
        inputs: [S_v]
        parameters: [R_oa0, g_or]
        outputs: [R_oa]
      # ----------------------------------------------------- effector levels
      - id: eq_metabolic_capacity
        form: piecewise
        label: Metabolic capacity with PEM penalty and floor
        expression_latex: "MC = \\max\\!\\big(0.05,\\; MC_0\\,(1 - k_{cap}\\,\\min(1, PEM))\\big)"
        inputs: [PEM]
        parameters: [MC_0, k_cap]
        outputs: [MC]
      - id: eq_splanchnic_resistance
        form: algebraic
        label: Splanchnic arterial resistance (vascular sympathetic modulation)
        expression_latex: "R_{sa} = R_{sa0}\\,\\big(1 + g_{sr}\\,(S_v - \\tfrac{1}{2})\\big)"
        inputs: [S_v]
        parameters: [R_sa0, g_sr]
        outputs: [R_sa]
      - id: eq_lower_limb_arterial_resistance
        form: algebraic
        label: Lower-limb arterial resistance (sympathetic and exertion modulation)
        expression_latex: "R_{la} = R_{la0}\\,\\big(1 + g_{lr}\\,(S_v - \\tfrac{1}{2})\\big)\\,(1 - k_{exr}\\,E)"
        inputs: [S_v, E]
        parameters: [R_la0, g_lr, k_exr]
        outputs: [R_la]
      - id: eq_lower_limb_venous_resistance
        form: algebraic
        label: Lower-limb venous resistance (sustained contraction impediment)
        expression_latex: "R_{lve} = R_{lv0}\\,(1 + k_{sc}\\,A_s)"
        inputs: [A_s]
        parameters: [R_lv0, k_sc]
        outputs: [R_lve]
      - id: eq_parallel_systemic_resistance
        form: algebraic
        label: Effective parallel systemic arterial resistance
        expression_latex: "R_{par} = \\left(\\frac{1}{R_{sa}} + \\frac{1}{R_{la}} + \\frac{1}{R_{oa}}\\right)^{-1}"
        inputs: [R_sa, R_la, R_oa]
        outputs: [R_par]
      - id: eq_contractility
        form: piecewise
        label: Contractility factor with floor
        expression_latex: "F_{ct} = \\max\\!\\big(0.2,\\; 1 + g_{ct}\\,(S_c - \\tfrac{1}{2})\\big)"
        inputs: [S_c]
        parameters: [g_ct]
        outputs: [F_ct]
      # ------------------------------------------------------- cardiac pump
      - id: eq_stroke_volume
        form: algebraic
        label: Preload-dependent stroke volume (saturating Frank-Starling law)
        expression_latex: "SV = SV_{max}\\,F_{ct}\\,\\frac{V_{cv}}{V_{cv} + V_{half}}"
        inputs: [F_ct, V_cv]
        parameters: [SV_max, V_half]
        outputs: [SV]
      - id: eq_heart_rate
        form: piecewise
        label: Heart rate law (autonomic and exertion drive, clipped)
        expression_latex: "HR = \\operatorname{clip}\\!\\big(HR_0 + g_{hrc}\\,(S_c - \\tfrac{1}{2}) + g_{hrv}\\,(\\tfrac{1}{2} - S_{vag}) + g_{ex}\\,E\\,MC,\\; 30,\\; 220\\big)"
        inputs: [S_c, S_vag, E, MC]
        parameters: [HR_0, g_hrc, g_hrv, g_ex]
        outputs: [HR]
      - id: eq_cardiac_pump_flow
        form: algebraic
        label: Cardiac pump flow
        expression_latex: "Q_h = HR \\cdot SV \\cdot \\frac{1\\,\\mathrm{min}}{60\\,\\mathrm{s}}"
        inputs: [HR, SV]
        outputs: [Q_h]
      - id: eq_cardiac_output
        form: algebraic
        label: Cardiac output in litres per minute
        expression_latex: "CO = Q_h \\cdot \\frac{60\\,\\mathrm{s}}{1\\,\\mathrm{min}} \\cdot \\frac{1\\,\\mathrm{L}}{1000\\,\\mathrm{mL}}"
        inputs: [Q_h]
        outputs: [CO]
      # ------------------------------------------------------------ flows
      - id: eq_splanchnic_arterial_flow
        form: piecewise
        label: Splanchnic arterial inflow (rectified Ohm law)
        expression_latex: "Q_{sa} = \\max\\!\\big(0,\\; \\frac{P_a - P_{sv}}{R_{sa}}\\big)"
        inputs: [P_a, P_sv, R_sa]
        outputs: [Q_sa]
      - id: eq_lower_limb_arterial_flow
        form: piecewise
        label: Lower-limb arterial inflow (rectified Ohm law)
        expression_latex: "Q_{la} = \\max\\!\\big(0,\\; \\frac{P_a - P_{lv}}{R_{la}}\\big)"
        inputs: [P_a, P_lv, R_la]
        outputs: [Q_la]
      - id: eq_other_systemic_arterial_flow
        form: piecewise
        label: Other-systemic arterial inflow (rectified Ohm law)
        expression_latex: "Q_{oa} = \\max\\!\\big(0,\\; \\frac{P_a - P_{ov}}{R_{oa}}\\big)"
        inputs: [P_a, P_ov, R_oa]
        outputs: [Q_oa]
      - id: eq_systemic_flow
        form: algebraic
        label: Total systemic arterial outflow
        expression_latex: "Q_{sys} = Q_{sa} + Q_{la} + Q_{oa}"
        inputs: [Q_sa, Q_la, Q_oa]
        outputs: [Q_sys]
      - id: eq_splanchnic_venous_return
        form: piecewise
        label: Splanchnic venous return against the hydrostatic sine-angle correction
        expression_latex: "Q_{svr} = \\max\\!\\big(0,\\; \\frac{P_{sv} - P_{cv} - 0.7356\\,h_{gs}\\sin\\theta}{R_{sv0}}\\big)"
        inputs: [P_sv, P_cv, theta]
        parameters: [h_gs, R_sv0]
        outputs: [Q_svr]
      - id: eq_muscle_pump_flow
        form: algebraic
        label: Rhythmic skeletal muscle pump flow
        expression_latex: "Q_{mp} = f_{mp}\\,SV_{mp}\\,\\eta_{mp}\\,A_r\\,\\frac{V_{lv}}{V_{lv} + V_{half,mp}}"
        inputs: [A_r, V_lv]
        parameters: [f_mp, SV_mp, eta_mp, V_half_mp]
        outputs: [Q_mp]
      - id: eq_lower_limb_venous_return
        form: piecewise
        label: Lower-limb venous return plus muscle pump
        expression_latex: "Q_{lvr} = \\max\\!\\big(0,\\; \\frac{P_{lv} - P_{cv} - 0.7356\\,h_{gl}\\sin\\theta}{R_{lve}}\\big) + Q_{mp}"
        inputs: [P_lv, P_cv, theta, R_lve, Q_mp]
        parameters: [h_gl]
        outputs: [Q_lvr]
      - id: eq_other_systemic_venous_return
        form: piecewise
        label: Other-systemic venous return against the hydrostatic sine-angle correction
        expression_latex: "Q_{ovr} = \\max\\!\\big(0,\\; \\frac{P_{ov} - P_{cv} - 0.7356\\,h_{go}\\sin\\theta}{R_{ov0}}\\big)"
        inputs: [P_ov, P_cv, theta]
        parameters: [h_go, R_ov0]
        outputs: [Q_ovr]
      - id: eq_venous_return
        form: algebraic
        label: Total venous return
        expression_latex: "Q_{vr} = Q_{svr} + Q_{lvr} + Q_{ovr}"
        inputs: [Q_svr, Q_lvr, Q_ovr]
        outputs: [Q_vr]
      # ------------------------------------------------- baroreflex targets
      - id: eq_aortic_baroreceptor_pressure
        form: piecewise
        label: Aortic baroreceptor pressure (heart-level sensor)
        expression_latex: "P_{ao} = \\max\\!\\big(0,\\; P_a - 0.7356\\,h_{ao}\\sin\\theta\\big)"
        inputs: [P_a, theta]
        parameters: [h_ao]
        outputs: [P_ao]
      - id: eq_carotid_sinus_pressure
        form: piecewise
        label: Carotid sinus pressure
        expression_latex: "P_{ca,s} = \\max\\!\\big(0,\\; P_a - 0.7356\\,h_{ca}\\sin\\theta\\big)"
        inputs: [P_a, theta]
        parameters: [h_ca]
        outputs: [P_ca_s]
      - id: eq_baroreflex_target
        form: piecewise
        label: Baroreflex autonomic target (dual-sensor weighted clipped logistic)
        expression_latex: "S_{br} = \\frac{1}{1 + e^{-\\varepsilon}},\\quad \\varepsilon = \\operatorname{clip}\\!\\left(w_{ao}\\frac{P_{set,ao} - P_{ao}}{s_{ao}} + w_{ca}\\frac{P_{set,ca} - P_{ca,s}}{s_{ca}},\\; -40,\\; 40\\right),\\quad w_{ao} + w_{ca} = 1"
        inputs: [P_ao, P_ca_s]
        parameters: [P_set_ao, P_set_ca, s_ao, s_ca, w_ao, w_ca]
        outputs: [S_br]
      # ------------------------------------------------------- cerebral bed
      - id: eq_brain_arterial_pressure
        form: piecewise
        label: Brain-level arterial pressure
        expression_latex: "P_{brain} = \\max\\!\\big(0,\\; P_a - 0.7356\\,h_{brain}\\sin\\theta\\big)"
        inputs: [P_a, theta]
        parameters: [h_brain]
        outputs: [P_brain]
      - id: eq_cerebral_perfusion_pressure
        form: piecewise
        label: Cerebral perfusion pressure (fixed effective outflow pressure)
        expression_latex: "P_{cpp} = \\max\\!\\big(0,\\; P_{brain} - P_{out}\\big)"
        inputs: [P_brain]
        parameters: [P_out]
        outputs: [P_cpp]
      - id: eq_cerebral_pressure_target
        form: piecewise
        label: Cerebral flow pressure target (residual autoregulation curve)
        expression_latex: "CFI_p = \\frac{r}{s_{ar} + (1 - s_{ar})\\,r},\\quad r = \\frac{P_{cpp}}{P_{cpp,ref}}"
        inputs: [P_cpp]
        parameters: [P_cpp_ref, s_ar]
        outputs: [CFI_p]
      - id: eq_cerebral_co2_factor
        form: piecewise
        label: Bounded exponential end-tidal-CO2 factor
        expression_latex: "F_{CO2} = \\exp\\!\\big(k_{co2}\\,\\operatorname{clip}(ETCO2_{in} - ETCO2_{ref},\\; -D_{co2},\\; D_{co2})\\big)"
        inputs: [ETCO2_in]
        parameters: [ETCO2_ref, k_co2, D_co2]
        outputs: [F_co2]
      - id: eq_cerebral_impairment_factor
        form: piecewise
        label: Cerebral orthostatic impairment factor
        expression_latex: "F_{imp} = \\max\\!\\big(0,\\; 1 - k_{oi}\\sin\\theta\\big)"
        inputs: [theta]
        parameters: [k_oi]
        outputs: [F_imp]
      - id: eq_cerebral_flow_target
        form: algebraic
        label: Cerebral flow index target assembly
        expression_latex: "CFI_t = CFI_p\\,F_{CO2}\\,F_{imp}"
        inputs: [CFI_p, F_co2, F_imp]
        outputs: [CFI_t]
      # --------------------------------------------------- oxygen and outputs
      - id: eq_oxygen_extraction
        form: piecewise
        label: Effective oxygen extraction with PEM penalty
        expression_latex: "X = \\operatorname{clip}\\!\\big(X_0\\,(1 - k_x\\,\\min(1, PEM)),\\; 0,\\; 0.99\\big)"
        inputs: [PEM]
        parameters: [X_0, k_x]
        outputs: [X]
      - id: eq_functional_capacity
        form: algebraic
        label: Functional capacity relative to reference extraction
        expression_latex: "FC = \\frac{MC \\cdot X}{X_{ref}}"
        inputs: [MC, X]
        parameters: [X_ref]
        outputs: [FC]
      - id: eq_mean_arterial_pressure
        form: algebraic
        label: Mean arterial pressure (beat-averaged arterial pressure)
        expression_latex: "MAP = P_a"
        inputs: [P_a]
        outputs: [MAP]
      - id: eq_mean_sympathetic_state
        form: algebraic
        label: Mean sympathetic state
        expression_latex: "S_{sym} = \\frac{S_c + S_v}{2}"
        inputs: [S_c, S_v]
        outputs: [S_sym]
      # ------------------------------------------------- volume conservation
      - id: eq_arterial_volume_balance
        form: differential
        label: Arterial volume balance
        expression_latex: "\\frac{dV_a}{dt} = Q_h - Q_{sys}"
        inputs: [Q_h, Q_sys]
        outputs: [V_a]
      - id: eq_central_venous_volume_balance
        form: differential
        label: Central venous volume balance
        expression_latex: "\\frac{dV_{cv}}{dt} = Q_{vr} - Q_h"
        inputs: [Q_vr, Q_h]
        outputs: [V_cv]
      - id: eq_splanchnic_venous_volume_balance
        form: differential
        label: Splanchnic venous volume balance
        expression_latex: "\\frac{dV_{sv}}{dt} = Q_{sa} - Q_{svr}"
        inputs: [Q_sa, Q_svr]
        outputs: [V_sv]
      - id: eq_lower_limb_venous_volume_balance
        form: differential
        label: Lower-limb venous volume balance
        expression_latex: "\\frac{dV_{lv}}{dt} = Q_{la} - Q_{lvr}"
        inputs: [Q_la, Q_lvr]
        outputs: [V_lv]
      - id: eq_other_systemic_venous_volume_balance
        form: differential
        label: Other-systemic (residual) venous volume balance
        expression_latex: "\\frac{dV_{ov}}{dt} = Q_{oa} - Q_{ovr}"
        inputs: [Q_oa, Q_ovr]
        outputs: [V_ov]
      # ----------------------------------------- differentiated autonomic loop
      - id: eq_cardiac_sympathetic_dynamics
        form: differential
        label: Cardiac sympathetic state (first-order baroreflex lag)
        expression_latex: "\\frac{dS_c}{dt} = \\frac{S_{br} - S_c}{\\tau_c}"
        inputs: [S_br, S_c]
        parameters: [tau_c]
        outputs: [S_c]
      - id: eq_vascular_sympathetic_dynamics
        form: differential
        label: Vascular sympathetic state (first-order baroreflex lag)
        expression_latex: "\\frac{dS_v}{dt} = \\frac{S_{br} - S_v}{\\tau_v}"
        inputs: [S_br, S_v]
        parameters: [tau_v]
        outputs: [S_v]
      - id: eq_vagal_dynamics
        form: differential
        label: Vagal state (reciprocal first-order baroreflex lag)
        expression_latex: "\\frac{dS_{vag}}{dt} = \\frac{1 - S_{br} - S_{vag}}{\\tau_{vag}}"
        inputs: [S_br, S_vag]
        parameters: [tau_vag]
        outputs: [S_vag]
      # ------------------------------------------- phenomenological PEM chain
      - id: eq_exertional_load_dynamics
        form: differential
        label: Exertional load relative to metabolic capacity
        expression_latex: "\\frac{dL_{ex}}{dt} = \\frac{E/MC - L_{ex}}{\\tau_{load}}"
        inputs: [E, MC, L_ex]
        parameters: [tau_load]
        outputs: [L_ex]
      - id: eq_delayed_stress_dynamics
        form: differential
        label: Delayed stress (slow tracking of exertional load)
        expression_latex: "\\frac{dD}{dt} = \\frac{L_{ex} - D}{\\tau_{delay}}"
        inputs: [L_ex, D]
        parameters: [tau_delay]
        outputs: [D]
      - id: eq_pem_severity_dynamics
        form: differential
        label: PEM severity with threshold trigger and asymmetric onset/recovery
        expression_latex: "\\frac{dPEM}{dt} = \\frac{PEM_{target} - PEM}{\\tau_{pem}},\\quad PEM_{target} = \\min\\!\\Big(1,\\; g_{pem}\\,\\max\\!\\big(0,\\, \\tfrac{D - \\theta_{pem}}{1 - \\theta_{pem}}\\big)\\Big),\\quad \\tau_{pem} = \\begin{cases} \\tau_{onset} & PEM_{target} > PEM \\\\ \\tau_{recov} & \\text{otherwise} \\end{cases}"
        inputs: [D, PEM]
        parameters: [g_pem, theta_pem, tau_onset, tau_recov]
        outputs: [PEM]
      - id: eq_cerebral_flow_dynamics
        form: differential
        label: Cerebral flow index with asymmetric decline/recovery
        expression_latex: "\\frac{dCFI}{dt} = \\frac{CFI_t - CFI}{\\tau_{cbf}},\\quad \\tau_{cbf} = \\begin{cases} \\tau_{dec} & CFI_t < CFI \\\\ \\tau_{rec} & \\text{otherwise} \\end{cases}"
        inputs: [CFI_t, CFI]
        parameters: [tau_dec, tau_rec]
        outputs: [CFI]
    assumptions:
      - Five lumped compliant compartments (arterial, central venous, splanchnic venous, lower-limb venous, residual other-systemic venous) with linear stressed pressure-volume relations and zero unstressed volume.
      - Total stressed blood volume is conserved (closed circulation; the five volume-balance derivatives telescope exactly, and the muscle pump redistributes volume without creating blood).
      - The heart is a prescribed flow source Q_h = HR * SV with preload-dependent, saturating stroke volume and sympathetic contractility modulation.
      - Regional flows are rectified (unidirectional) Ohm-law flows driven by compartment pressure differences and hydrostatic corrections of lumped height times sin(tilt angle).
      - "The baroreflex integrates separate aortic-arch and carotid-sinus pressures (each hydrostatically corrected at its own height) with weights summing to 1, and drives three differentiated first-order autonomic states: cardiac sympathetic, vascular sympathetic and vagal."
      - "Protocol inputs are the explicit tilt angle (0-90 degrees), the per-segment end-tidal CO2 (strictly positive when declared), the legacy normalized upright fraction, exertion, and rhythmic/sustained muscle activity; within a transition only the angle is linearly interpolated while the other inputs stay piecewise constant."
      - The cerebral flow target multiplies the autoregulation pressure target by a fixed-outflow-pressure perfusion term, a bounded exponential end-tidal-CO2 factor, and an orthostatic impairment factor.
      - The exertional-load/delayed-stress/PEM cascade is an explicitly phenomenological exertion-delay-recovery approximation, not a claim that the cellular cause of PEM is known.
    limitations:
      - "Beat-averaged: no pulsatile ventricular dynamics, valve mechanics or pulmonary circulation."
      - Hydrostatics enter as lumped height times sin(tilt angle) corrections; there is no distributed postural geometry, venous-valve or column-collapse dynamics.
      - Cerebral flow index is a lumped perfusion-pressure approximation with a residual autoregulation slope, not vessel-level autoregulation.
      - No transcapillary fluid exchange, haemorrhage or renal volume regulation; blood volume changes only through the blood volume factor operating point.
      - Metabolic capacity, oxygen extraction and PEM dynamics are phenomenological couplings; their parameters are calibration assumptions, not clinical measurements.
      - Solver settings (method, step size, tolerances) are implementation concerns and are intentionally outside this specification.
    validity_domain:
      - scope_note: >
          Supine-to-upright and rest-to-mild-exertion adult physiology near the
          nominal operating point; not validated for strenuous exercise,
          haemorrhage or critical care.
        activity: rest
        posture: supine-to-upright

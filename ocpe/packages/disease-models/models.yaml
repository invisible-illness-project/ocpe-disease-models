        unit: s
        nominal_value: 6.0
        value_range: {min: 0.0}
        x-executable-parameter: cardiac_sympathetic_time_constant
      - symbol: tau_v
        role: parameter
        label: Vascular sympathetic time constant
        unit: s
        nominal_value: 10.0
        value_range: {min: 0.0}
        x-executable-parameter: vascular_sympathetic_time_constant
      - symbol: tau_vag

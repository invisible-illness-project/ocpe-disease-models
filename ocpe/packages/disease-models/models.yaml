        unit: "/min"
        nominal_value: 70.0
        value_range: {min: 0.0}
        x-executable-parameter: exercise_heart_rate_gain
      - symbol: k_exr
        role: parameter
        label: Exertional lower-limb resistance reduction fraction
        unit: "1"
        nominal_value: 0.3
        value_range: {min: 0.0, max: 1.0}
        x-executable-parameter: exercise_resistance_reduction
      # ------------------------------------------------- skeletal muscle pump
      - symbol: SV_mp
        role: parameter
        label: Muscle pump stroke volume
        unit: mL
        nominal_value: 20.0
        value_range: {min: 0.0}
        x-executable-parameter: muscle_pump_stroke_volume
      - symbol: f_mp
        role: parameter
        label: Muscle pump frequency
        unit: Hz
        nominal_value: 1.0
        value_range: {min: 0.0}
        x-executable-parameter: muscle_pump_frequency
      - symbol: eta_mp
        role: parameter
        label: Muscle pump effectiveness
        unit: "1"
        nominal_value: 1.0
        value_range: {min: 0.0}
        x-executable-parameter: muscle_pump_effectiveness
      - symbol: V_half_mp
        role: parameter
        label: Lower-limb volume at half-maximal muscle pump flow
        unit: mL
        nominal_value: 500.0
        value_range: {min: 0.0}
        x-executable-parameter: muscle_pump_half_volume
      - symbol: k_sc

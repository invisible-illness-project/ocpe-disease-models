      - symbol: tau_recov
        role: parameter
        label: PEM recovery time constant
        unit: s
        nominal_value: 172800.0
        value_range: {min: 0.0}
        x-executable-parameter: pem_recovery_time_constant
      - symbol: theta_pem
        role: parameter
        label: PEM trigger threshold (delayed stress)
        unit: "1"
        nominal_value: 0.999
        value_range: {min: 0.0, max: 1.0}
        x-executable-parameter: pem_trigger_threshold
      - symbol: g_pem
        role: parameter
        label: PEM response gain
        unit: "1"
        nominal_value: 0.0
        value_range: {min: 0.0}
        x-executable-parameter: pem_response_gain
      # -------------------------------------------------------------- inputs
      - symbol: U
        role: input
        label: Upright fraction (legacy)
        description: >
          Legacy normalized orthostatic stress (0 = supine, 1 = fully upright),
          migrated by the executable to theta = arcsin(U); superseded by the
          explicit tilt angle theta.
        unit: "1"
        nominal_value: 0.0
        value_range: {min: 0.0, max: 1.0}
        x-executable-input: upright
      - symbol: theta
        role: input
        label: Head-up tilt angle
        description: Explicit orthostatic tilt angle; drives every hydrostatic correction as height * sin(theta).
        unit: deg
        nominal_value: 0.0
        value_range: {min: 0.0, max: 90.0}
        x-executable-input: tilt_angle_deg
      - symbol: T_tr
        role: input
        label: Posture-transition duration
        description: >
          Duration of the linear transition from the preceding segment's posture
          to this segment's posture; other inputs remain piecewise constant.
        unit: s
        nominal_value: 0.0
        value_range: {min: 0.0}
        x-executable-input: transition_duration
      - symbol: ETCO2_in
        role: input
        label: End-tidal CO2 input
        description: >
          Per-segment end-tidal CO2; must be strictly positive when declared and
          resolves to ETCO2_ref when omitted. An approximate, biased surrogate of
          arterial PCO2.
        unit: mm[Hg]
        nominal_value: 40.0
        value_range: {min: 1.0, max: 150.0}
        x-executable-input: end_tidal_co2_mmHg
      - symbol: E

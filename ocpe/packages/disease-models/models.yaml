        role: parameter
        label: Baseline metabolic capacity
        unit: "1"
        nominal_value: 1.0
        value_range: {min: 0.0}
        x-executable-parameter: baseline_metabolic_capacity
      - symbol: X_0
        role: parameter
        label: Oxygen extraction fraction
        unit: "1"
        nominal_value: 0.78
        value_range: {min: 0.0, max: 1.0}
        x-executable-parameter: oxygen_extraction_fraction
      - symbol: X_ref
        role: parameter
        label: Reference extraction for functional capacity
        unit: "1"
        nominal_value: 0.78
        value_range: {min: 0.0, max: 1.0}

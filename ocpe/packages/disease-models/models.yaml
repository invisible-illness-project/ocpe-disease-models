# Declarative model specifications (never solver code).
ocpe: "0.1"
package: disease-models
title: Disease-model declarative models
description: >
  Declarative specification of the shared 12-state cardiovascular, autonomic,
  muscle-pump, cerebral-perfusion and PEM physiology model executed by the
  ocpe-disease-models simulations. OCPE stores the specification only;
  numerical execution lives in the Python implementation. Every symbol carries
  an `x-executable-*` binding to its counterpart in
  src/ocpe_disease_models/models/shared/model.py so the declarative and
  executable forms can be checked for consistency.
entities:
  - id: ocpe:disease-models/shared-physiology
    kind: model
    label: Shared cardiovascular-autonomic-PEM physiology model
    definition: >
      Beat-averaged lumped physiology model with five compliant
      stressed-blood-volume compartments (arterial, central venous, splanchnic
      venous, lower-limb venous, residual other-systemic venous), a
      preload-dependent cardiac pump, rectified Ohm-law regional flows, a
      skeletal-muscle pump, and three differentiated first-order
      baroreflex-driven autonomic states (cardiac sympathetic, vascular
      sympathetic, vagal). The baroreflex integrates separate aortic-arch and
      carotid-sinus pressures with validated weights; hydrostatic corrections
      use lumped heights times sin(tilt angle); a fixed effective cerebral
      outflow pressure and a bounded exponential end-tidal-CO2 factor act on
      the cerebral flow index, which tracks brain-level perfusion pressure with
      asymmetric decline/recovery dynamics; a phenomenological
      exertional-load/delayed-stress/PEM cascade couples exertion to metabolic
      capacity. Total stressed blood volume is conserved across the five
      compartments.
    description: >
      The identifier `ocpe:disease-models/shared-physiology` supersedes the
      legacy three-compartment identifier, retained below as an alias for
      archived observation records. The current declaration is the 12-state
      shared physiology architecture; the legacy three-compartment,
      single-sympathetic-state declarations and the Stage 1 fixed-offset
      hydrostatics / single-sensor baroreflex forms were superseded. Time is
      seconds, volumes mL, pressures mmHg, flows mL/s, heights cm, tilt angles
      degrees. Initial state: volumes from the initial-volume/pressure
      parameters scaled by f_bv (residual bed nominal 500 mL), autonomic
      states 0.5, load/stress/PEM states 0, and CFI at its pressure-derived
      target. Clip bounds 30-220 /min (heart rate), +/-40 (weighted baroreflex
      error), +/-15 mmHg (end-tidal-CO2 deviation), 0.05 (metabolic capacity
      floor) and 0.2 (contractility floor) are fixed numerical safeguards of
      the specification, not calibrated parameters.
    aliases:
      - value: three-compartment-cardiovascular
        type: legacy-id
    status: provisional
    formalism: ode
    scope: >
      Supine-to-upright and rest-to-mild-exertion cardiovascular, autonomic,
      cerebral-perfusion and exertion/PEM regulation in adults.
    symbols:
      - symbol: t
        role: time
        unit: s
        label: Time
      # ------------------------------------------------------------- states
      - symbol: V_a
        role: state
        label: Arterial stressed volume
        unit: mL
        represents: ocpe:disease-models/arterial-blood-volume
        nominal_value: 150.0
        value_range: {min: 0.0}
        x-executable-state: arterial_volume
      - symbol: V_cv
        role: state
        label: Central venous stressed volume
        unit: mL
        represents: ocpe:disease-models/central-venous-blood-volume
        nominal_value: 700.0
        value_range: {min: 0.0}
        x-executable-state: central_venous_volume
      - symbol: V_sv
        role: state
        label: Splanchnic venous stressed volume
        unit: mL
        represents: ocpe:disease-models/splanchnic-venous-blood-volume
        nominal_value: 700.0
        value_range: {min: 0.0}
        x-executable-state: splanchnic_venous_volume
      - symbol: V_lv
        role: state
        label: Lower-limb venous stressed volume
        unit: mL
        represents: ocpe:disease-models/lower-limb-venous-blood-volume
        nominal_value: 500.0
        value_range: {min: 0.0}
        x-executable-state: lower_limb_venous_volume
      - symbol: V_ov
        role: state
        label: Other-systemic (residual) venous stressed volume
        unit: mL
        nominal_value: 500.0
        value_range: {min: 0.0}
        x-executable-state: other_systemic_venous_volume
      - symbol: S_c
        role: state
        label: Cardiac sympathetic state
        unit: "1"
        nominal_value: 0.5
        value_range: {min: 0.0, max: 1.0}
        x-executable-state: cardiac_sympathetic_state
      - symbol: S_v
        role: state
        label: Vascular sympathetic state
        unit: "1"
        nominal_value: 0.5
        value_range: {min: 0.0, max: 1.0}
        x-executable-state: vascular_sympathetic_state
      - symbol: S_vag
        role: state
        label: Vagal state
        unit: "1"
        nominal_value: 0.5
        value_range: {min: 0.0, max: 1.0}
        x-executable-state: vagal_state
      - symbol: L_ex
        role: state
        label: Exertional load (exertion relative to metabolic capacity)
        unit: "1"
        nominal_value: 0.0
        value_range: {min: 0.0}
        x-executable-state: exertional_load
      - symbol: D
        role: state
        label: Delayed stress (slow exertion integral)
        unit: "1"
        nominal_value: 0.0
        value_range: {min: 0.0}
        x-executable-state: delayed_stress
      # ---------------------------------------------- regional vascular beds
      - symbol: C_a
        role: parameter
        label: Arterial compliance
        unit: mL/mm[Hg]
        nominal_value: 1.5
        value_range: {min: 0.0}
        x-executable-parameter: arterial_compliance
      - symbol: C_cv

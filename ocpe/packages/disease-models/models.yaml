        unit: cm
        nominal_value: 27.0
        value_range: {min: 0.0}
        x-executable-parameter: brain_hydrostatic_height_cm
      - symbol: P_out
        role: parameter
        label: Fixed effective cerebral outflow pressure
        unit: mm[Hg]
        nominal_value: 5.0
        value_range: {min: 0.0}
        x-executable-parameter: cerebral_outflow_pressure_mmHg
      - symbol: P_cpp_ref
        role: parameter
        label: Reference cerebral perfusion pressure
        unit: mm[Hg]
        nominal_value: 95.0
        value_range: {min: 0.0}
        x-executable-parameter: cerebral_reference_perfusion_pressure
      - symbol: s_ar
        role: parameter
        label: Cerebral autoregulation residual slope
        unit: "1"
        nominal_value: 0.4
        value_range: {min: 0.0, max: 1.0}
        x-executable-parameter: cerebral_autoregulation_residual_slope
      - symbol: k_oi
        role: parameter
        label: Cerebral orthostatic impairment fraction
        unit: "1"
        nominal_value: 0.0
        value_range: {min: 0.0, max: 1.0}
        x-executable-parameter: cerebral_orthostatic_impairment
      - symbol: tau_dec
        role: parameter
        label: Cerebral flow decline time constant
        unit: s
        nominal_value: 5.0
        value_range: {min: 0.0}
        x-executable-parameter: cerebral_decline_time_constant
      - symbol: tau_rec
        role: parameter
        label: Cerebral flow recovery time constant
        unit: s
        nominal_value: 12.0
        value_range: {min: 0.0}
        x-executable-parameter: cerebral_recovery_time_constant

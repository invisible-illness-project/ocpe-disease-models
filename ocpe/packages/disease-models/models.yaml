        x-executable-parameter: splanchnic_venous_resistance
      - symbol: R_lv0
        role: parameter
        label: Lower-limb venous resistance (reference)
        unit: mm[Hg].s/mL
        nominal_value: 0.24489795918367346
        value_range: {min: 0.0}
        x-executable-parameter: lower_limb_venous_resistance
      - symbol: R_ov0
        role: parameter
        label: Other-systemic (residual) venous resistance
        unit: mm[Hg].s/mL
        nominal_value: 0.12244897959183673
        value_range: {min: 0.0}
        x-executable-parameter: other_systemic_venous_resistance
      - symbol: g_sr
        role: parameter
        label: Splanchnic resistance vascular-sympathetic gain
        unit: "1"
        nominal_value: 0.8
        value_range: {min: 0.0, max: 2.0}
        x-executable-parameter: splanchnic_resistance_sympathetic_gain
      - symbol: g_lr

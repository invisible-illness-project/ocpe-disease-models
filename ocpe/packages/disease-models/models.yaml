      - symbol: k_cap
        role: parameter
        label: PEM metabolic-capacity penalty
        unit: "1"
        nominal_value: 0.5
        value_range: {min: 0.0, max: 1.0}
        x-executable-parameter: pem_capacity_penalty
      - symbol: k_x
        role: parameter
        label: PEM oxygen-extraction penalty
        unit: "1"
        nominal_value: 0.1
        value_range: {min: 0.0, max: 1.0}
        x-executable-parameter: pem_extraction_penalty
      # ------------------------------------------- phenomenological PEM chain
      - symbol: tau_load
        role: parameter
        label: Exertional load time constant
        unit: s
        nominal_value: 1800.0
        value_range: {min: 0.0}
        x-executable-parameter: exertional_load_time_constant
      - symbol: tau_delay
        role: parameter
        label: Delayed stress time constant
        unit: s
        nominal_value: 21600.0
        value_range: {min: 0.0}
        x-executable-parameter: delayed_stress_time_constant
      - symbol: tau_onset
        role: parameter
        label: PEM onset time constant
        unit: s
        nominal_value: 86400.0

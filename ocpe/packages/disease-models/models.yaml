        unit: mm[Hg]
        nominal_value: 10.0
        value_range: {min: 0.0}
        x-executable-parameter: splanchnic_venous_pressure_initial
      - symbol: P_lv0
        role: parameter
        label: Initial lower-limb venous pressure
        unit: mm[Hg]
        nominal_value: 10.0
        value_range: {min: 0.0}
        x-executable-parameter: lower_limb_venous_pressure_initial
      - symbol: P_ov0
        role: parameter
        label: Initial other-systemic (residual) venous pressure
        unit: mm[Hg]
        nominal_value: 10.0
        value_range: {min: 0.0}
        x-executable-parameter: other_systemic_venous_pressure_initial
      - symbol: f_bv
        role: parameter
        label: Blood volume scaling factor
        unit: "1"
        nominal_value: 1.0
        value_range: {min: 0.0}
        x-executable-parameter: blood_volume_factor
      # ----------------------------------------- cardiac and baroreflex loop
      - symbol: SV_max
        role: parameter
        label: Maximum stroke volume
        unit: mL
        nominal_value: 100.0
        value_range: {min: 0.0}
        x-executable-parameter: stroke_volume_max
      - symbol: V_half
        role: parameter
        label: Central venous volume at half-maximal stroke volume
        unit: mL
        nominal_value: 300.0
        value_range: {min: 0.0}
        x-executable-parameter: stroke_volume_half_volume
      - symbol: g_ct
        role: parameter
        label: Contractility cardiac-sympathetic gain
        unit: "1"
        nominal_value: 0.25
        value_range: {min: 0.0}
        x-executable-parameter: contractility_sympathetic_gain
      - symbol: HR_0

        unit: "/min"
        nominal_value: 20.0
        value_range: {min: 0.0}
        x-executable-parameter: heart_rate_cardiac_sympathetic_gain
      - symbol: g_hrv
        role: parameter
        label: Heart-rate vagal gain
        unit: "/min"
        nominal_value: 20.0
        value_range: {min: 0.0}
        x-executable-parameter: heart_rate_vagal_gain
      - symbol: P_set_ao
        role: parameter
        label: Aortic baroreflex pressure set-point
        unit: mm[Hg]
        nominal_value: 100.0
        value_range: {min: 0.0}
        x-executable-parameter: aortic_baroreflex_pressure_setpoint
      - symbol: P_set_ca
        role: parameter
        label: Carotid baroreflex pressure set-point
        unit: mm[Hg]
        nominal_value: 100.0
        value_range: {min: 0.0}
        x-executable-parameter: carotid_baroreflex_pressure_setpoint
      - symbol: s_ao
        role: parameter

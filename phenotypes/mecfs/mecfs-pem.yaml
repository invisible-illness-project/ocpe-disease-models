id: mecfs-pem
label: ME/CFS post-exertional malaise and delayed recovery
diseases: [ME/CFS]
mechanisms: [MEC-RCV-PEM, MEC-MET-CAPACITY, MEC-CBF-AUTOREG]
evidence_claims: [CLM-ME-PEM-KINETICS, CLM-ME-CPET, CLM-ME-CBF, CLM-ME-PRELOAD]
parameter_overrides:
  splanchnic_gravity_pressure_offset: 4.5
  lower_limb_gravity_pressure_offset: 9.0
  cerebral_orthostatic_impairment: 0.23
  cerebral_recovery_time_constant: 240.0
  baseline_metabolic_capacity: 0.85
  oxygen_extraction_fraction: 0.74
  delayed_stress_time_constant: 72000.0
  pem_onset_time_constant: 86400.0
  pem_recovery_time_constant: 172800.0
  pem_trigger_threshold: 0.001
  pem_response_gain: 20.0

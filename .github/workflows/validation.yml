name: Extended validation

# Scientific validation beyond the PR gate: strict OCPE package validation,
# the six curated demonstrations, the deterministic sensitivity analysis, the
# strict traceability audit, and the seven-layer validation runner.
#
# Design rule (docs/validation/validation-runbook.md §9): a missing layer or
# an empty pytest selection is a failure, not a skip. All seven layers have
# executable tests and must pass independently. Do not add continue-on-error,
# || true, or marker deselection to silence a failure — that would mask a
# scientific or software regression.

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Extended validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras (pinned OCPE git dependency)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Strict OCPE package validation
        run: python -m ocpe validate ocpe/packages/disease-models --strict

      - name: Strict traceability audit
        run: python scripts/audit_traceability.py --root . --strict

      - name: Run all six demonstrations
        # Demonstrations are reproducibility evidence, not validation passes.
        # Outputs land in examples/*/output/ and are NOT uploaded (they contain
        # traces; only small reports are artifact-eligible).
        run: python scripts/run_examples.py

      - name: Run deterministic sensitivity analysis
        # Deterministic scenario grids, not synthetic patients, wearable
        # data, or population-level uncertainty estimates.
        run: python scripts/run_sensitivity.py

      - name: Seven-layer validation runner
        # --no-analysis: the sensitivity step above already regenerated its
        # outputs. The runner reports every layer independently and fails on
        # any missing/empty layer, failed audit, or strict-audit warning.
        run: python scripts/run_validation.py --no-analysis

      - name: Upload validation reports
        # Small validation reports only. Traces, cohorts, demonstration
        # outputs (examples/*/output/), sensitivity CSVs, and figures are
        # deliberately excluded.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports-py${{ matrix.python-version }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            validation/reports/validation-report.json
            validation/reports/validation-report.md
            validation/reports/*.log
            validation/traceability/audit/traceability_report.json
            validation/traceability/audit/traceability_report.md
            validation/sensitivity/sensitivity-report.md

- id: VAL-PHYS-TILT-ANGLE
  name: Explicit tilt-angle hydrostatic geometry
  layer: physiological
  mechanisms:
  - MEC-ORTHO-HYDROSTATIC
  - MEC-VASC-POOLING
  - MEC-AUT-BAROREFLEX
  expected_behavior: An explicit tilt angle in [0, 90] degrees drives every hydrostatic correction as lumped
    height times sin(angle) times 0.7356 mmHg/cm; the legacy normalized upright input migrates as
    angle = arcsin(upright); during a transition only the angle is linearly interpolated while all other
    inputs stay piecewise constant; aortic, carotid and brain heights act at separate sites.
  acceptance_criteria: All hydrostatic corrections are exactly zero at 0 degrees and scale with sin(angle);
    the aortic/carotid baroreflex weights sum to 1 within 1e-6; legacy upright 0/1 reproduces 0/90 degrees;
    invalid angles fail explicitly; five-volume conservation holds at every angle.

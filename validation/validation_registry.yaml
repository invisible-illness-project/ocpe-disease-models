- id: VAL-PHYS-SHARED
  name: Regional muscle, autonomic and cerebral shared mechanisms
  layer: physiological
  mechanisms:
  - MEC-MUSCLE-PUMP
  - MEC-SUSTAINED-CONTRACTION
  - MEC-AUT-BAROREFLEX
  - MEC-CBF-AUTOREG
  expected_behavior: Rhythmic activity transfers rather than creates volume; sustained contraction impedes passive
    lower-limb venous return; cardiac-sympathetic, vascular-sympathetic and vagal effectors remain independent;
    CFI follows head-level CPP and declared bounds.
  acceptance_criteria: Pump-induced central and lower-limb RHS changes are equal and opposite; walking/rhythmic/sustained
    protocols conserve volume; vascular-sympathetic activation changes resistance without directly changing HR;
    vagal lag is faster than cardiac-sympathetic lag; f(0)=0, f(CPP_ref)=1 and CFI stays within [0,1.25] for all
    phenotypes; invalid domains and non-finite states fail explicitly.
  justification: Separates mechanism-level physiological checks from disease-threshold calibration and prevents
    a beneficial-pump assumption from being applied to sustained contraction.

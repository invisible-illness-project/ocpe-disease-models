- id: VAL-MATH-CONSERVATION
  name: Stressed-volume conservation
  layer: mathematical
  mechanisms:
  - MEC-CV-VOLUME
  expected_behavior: The sum of arterial, central-venous, splanchnic-venous, lower-limb-venous and residual
    other-systemic stressed volumes remains invariant, including rhythmic walking and sustained contraction.
  acceptance_criteria: Maximum absolute five-volume drift is below 1e-6 mL over baseline, orthostatic, walking and
    sustained-contraction runs; all five instantaneous RHS volume derivatives telescope within floating-point tolerance.

schema_version: '1.0'
validation_policy:
  independence: Each layer is reported separately; a pass in one layer cannot substitute for another.
  clinical_status: No layer establishes clinical validity, diagnostic accuracy, treatment efficacy, or patient-specific
    calibration.
  empirical_comparisons: Group-level literature anchors are heterogeneous plausibility checks, not fitted individual
    data or prospective external validation.
  required_test_behavior: Missing required tests, registry entries, references, or outputs are failures and must
    not be hidden by skips.
validation_tests:
- id: VAL-SW-CONFIG
  name: Configuration and phenotype composition
  layer: software
  expected_behavior: YAML configurations load deterministically; unknown parameters, invalid protocols, and conflicting
    comorbidity overrides fail explicitly.
  acceptance_criteria: All healthy and disease configurations round-trip without silent changes; conflicting parameter
    values raise ValueError; mixed non-conflicting mechanisms compose deterministically.
  justification: Prevents silent parameter override ordering and unrecorded configuration drift.
  test_path: tests/unit/test_configuration.py
  evidence_claims: []
  equation_ids: []
  parameter_ids: []
  validation_result:
    status: PASS
    execution_date: '2026-11-17'
    report: validation/reports/validation-report.json
    scope: Declared computational/scientific check passed at the tested source commit; not clinical validation
  execution_environment:
    python_requirement: '>=3.11'
    executed_python: 3.12.12
    solver: DOP853 where applicable
    dependency_versions: validation/reproducibility.json
  last_validated_commit: a6d7619e277fc05081de3c852189b549d714b8b5
- id: VAL-SW-SERIALIZATION
  name: Serialization and numerical failure behavior
  layer: software
  expected_behavior: Small traces and metadata serialize reproducibly; non-finite or failed solver output cannot
    be reported as success.
  acceptance_criteria: Saved parameters/protocol/configuration hash match the in-memory run; required metadata and
    arrays are present; invalid parameter domains raise explicit errors.
  justification: Execution integrity is necessary but is not physiological or clinical validation.
  test_path: tests/unit/test_serialization.py

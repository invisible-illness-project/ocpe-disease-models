schema_version: '1.0'
evidence_grades:
  E0: Unsupported or contradicted assertion; not eligible for implementation.
  E1: Hypothesis, narrative mechanistic proposal, preprint, or indirect evidence.
  E2: Small, selected, or unreplicated human observational/physiological evidence.
  E3: Replicated human physiology or convergent controlled observational evidence with limitations.
  E4: Systematic review, meta-analysis, large controlled cohort, or formal consensus evidence.
  E5: Convergent high-quality evidence with independent prospective replication of the specific claim.
evidence_claims:
- id: CLM-CV-HEMODYNAMICS
  statement: Pressure-volume relations, resistance-driven flows, conservative compartment balances and first-order feedback
    are defensible reduced-order cardiovascular representations.
  description: Pressure-volume relations, resistance-driven flows, conservative compartment balances and first-order feedback
    are defensible reduced-order cardiovascular representations.
  diseases:
  - shared
  - POTS
  mechanism: Conservative lumped hemodynamics and pressure-feedback control
  references:
  - REF-GEDDES-2022
  evidence_type: computational physiology supported by clinical observations
  measured_variables:
  - pressure
  - volume
  - flow
  - heart rate
  reported_effect: Closed-loop compartment models reproduce orthostatic HR/BP dynamics and mechanistic POTS configurations.
  parameter_implications: Supports equation structure, not the numerical values in this reduced three-compartment adaptation.
  evidence_grade: E3
  confidence: medium
  limitations: Structural support does not validate this simpler model or its calibrated operating point.
  modeling_implications: Implement volume conservation and feedback explicitly; benchmark outputs independently.
  implementation_links:
  - MEC-CV-VOLUME
  - MEC-AUT-BAROREFLEX
  validation_links:
  - VAL-MATH-CONSERVATION
  - VAL-PHYS-TILT
  confidence_detail: moderate
- id: CLM-POTS-CRITERIA
  statement: POTS is characterized by a sustained excessive orthostatic HR rise without orthostatic hypotension; adult criterion
    ≥30 bpm and adolescent criterion ≥40 bpm.
  description: POTS is characterized by a sustained excessive orthostatic HR rise without orthostatic hypotension; adult criterion
    ≥30 bpm and adolescent criterion ≥40 bpm.
  diseases:
  - POTS
  mechanism: Sustained orthostatic tachycardia
  references:
  - REF-SHELDON-2015
  - REF-GEDDES-2022
  evidence_type: consensus and clinical physiology
  measured_variables:
  - supine HR
  - upright HR
  - blood pressure
  reported_effect: Thresholds define scenario-level comparisons, not proof of clinical validity.
  parameter_implications: No direct parameter value; supplies an empirical acceptance metric.
  evidence_grade: E4
  confidence: high
  limitations: Age, measurement protocol and confounders matter; simulation is not diagnosis.
  modeling_implications: Report HR rise and MAP separately and never infer disease from a trace.
  implementation_links:
  - MEC-AUT-BAROREFLEX
  validation_links:
  - VAL-POTS-NEUROPATHIC
  - VAL-POTS-HYPER
  - VAL-POTS-HYPO
  confidence_detail: high for diagnostic definition
- id: CLM-POTS-PHENOTYPES
  statement: POTS is heterogeneous and subtype mechanisms can coexist rather than forming disjoint diagnoses.
  description: POTS is heterogeneous and subtype mechanisms can coexist rather than forming disjoint diagnoses.
  diseases:
  - POTS
  mechanism: Overlapping neuropathic, hypovolemic and hyperadrenergic mechanisms
  references:
  - REF-LOW-2009
  - REF-GEDDES-2022
  - REF-FU-2018
  - REF-THIEBEN-2007
  - REF-FU-2010
  evidence_type: clinical reviews and computational physiology
  reported_effect: Different mechanism perturbations can produce similar orthostatic tachycardia.
  parameter_implications: Use coherent mechanism configurations and mixed phenotypes rather than output multipliers.
  evidence_grade: E3
  confidence: medium
  limitations: Subtype prevalence and boundaries vary across cohorts.
  modeling_implications: Compose mechanisms and disclose joint calibration assumptions.
  implementation_links:
  - MEC-VASC-CONSTRICTION
  - MEC-VOL-HYPOVOLEMIA
  - MEC-AUT-HYPERADRENERGIC
  validation_links:
  - VAL-POTS-NEUROPATHIC
  - VAL-POTS-HYPER
  - VAL-POTS-HYPO
  confidence_detail: moderate-high
- id: CLM-POTS-POOLING
  statement: Regional vascular dysfunction and inadequate vasoconstriction can reduce venous return and stroke volume during
    orthostasis.
  description: Regional vascular dysfunction and inadequate vasoconstriction can reduce venous return and stroke volume during
    orthostasis.
  diseases:
  - POTS
  mechanism: Peripheral venous pooling and impaired venous return
  references:
  - REF-STEWART-2003
  - REF-LOW-2009
  - REF-FU-2018
  - REF-JACOB-2000
  - REF-GIBBONS-2013
  evidence_type: clinical vascular physiology
  measured_variables:
  - regional blood flow
  - vascular resistance
  - venous return
  - stroke volume
  reported_effect: Excess pooling and impaired vasoconstriction are observed in POTS subgroups.
  parameter_implications: Supports direction of gravity-offset and resistance-modulation changes, not a universal magnitude.
  evidence_grade: E3
  confidence: medium
  limitations: Regional observations cannot identify whole-body lumped parameters.
  modeling_implications: Orthostatic input reduces effective venous-return driving pressure; compensation affects HR and resistance.
  implementation_links:
  - MEC-VASC-POOLING
  - MEC-VASC-CONSTRICTION
  validation_links:
  - VAL-PHYS-TILT
  - VAL-POTS-NEUROPATHIC
  confidence_detail: moderate-high
- id: CLM-POTS-HYPOVOLEMIA
  statement: A POTS cohort showed approximately 13% plasma-volume deficit with inappropriately low renin/aldosterone responses.
  description: A POTS cohort showed approximately 13% plasma-volume deficit with inappropriately low renin/aldosterone responses.
  diseases:
  - POTS
  mechanism: Reduced effective circulating volume and RAAS dysregulation
  references:
  - REF-RAJ-2005
  - REF-FU-2010
  evidence_type: controlled clinical physiology
  study_population: POTS and healthy controls
  sample_size: 29
  measured_variables:
  - plasma volume
  - red-cell volume
  - renin
  - aldosterone
  reported_effect: Raj et al. studied 15 POTS and 14 controls; plasma volume 2348±438 versus 2823±480 mL and deficit 334±187
    mL. Fu et al. found baseline blood volume 60 mL/kg [54,64] versus 71 mL/kg [65,78] in 27 POTS and 16 controls.
  parameter_implications: Anchors an uncertainty range for volume sensitivity; 0.92 stressed-volume factor is an assumption,
    not the measured plasma deficit.
  evidence_grade: E2
  confidence: medium
  limitations: Small cohort and compartment mismatch; RAAS dynamics are not implemented.
  modeling_implications: Scale initial stressed volumes conservatively and label the value as calibrated/assumed.
  implementation_links:
  - MEC-VOL-HYPOVOLEMIA
  - MEC-RAAS
  validation_links:
  - VAL-POTS-HYPO
  - VAL-SENSITIVITY
  confidence_detail: moderate
- id: CLM-POTS-HYPERADRENERGIC
  statement: Increased sympathetic/chronotropic response characterizes a subset of POTS and can be represented by altered
    feedback gain.
  description: Increased sympathetic/chronotropic response characterizes a subset of POTS and can be represented by altered
    feedback gain.
  diseases:
  - POTS
  mechanism: Hyperadrenergic chronotropic response
  references:
  - REF-LOW-2009
  - REF-GEDDES-2022
  - REF-MUENTER-2005
  - REF-THIEBEN-2007
  evidence_type: clinical and computational physiology
  measured_variables:
  - catecholamines
  - sympathetic activity
  - HR
  - BP
  reported_effect: Increased baroreflex sensitivity can reproduce persistent tachycardia in models.
  parameter_implications: Supports direction of increased HR gain; numerical gain is calibrated.
  evidence_grade: E3
  confidence: medium
  limitations: Not all elevated catecholamines are primary hyperadrenergic POTS; no catecholamine state is modeled.
  modeling_implications: Vary chronotropic gain while retaining conservative hemodynamics.
  implementation_links:
  - MEC-AUT-HYPERADRENERGIC
  validation_links:
  - VAL-POTS-HYPER
  confidence_detail: moderate
- id: CLM-POTS-BAROREFLEX
  statement: Baroreflex-mediated sympathetic and chronotropic control is relevant to POTS, but abnormalities are not uniform
    across all patients.
  description: Baroreflex-mediated sympathetic and chronotropic control is relevant to POTS, but abnormalities are not uniform
    across all patients.
  diseases:
  - POTS
  mechanism: Altered baroreflex control
  references:
  - REF-MUENTER-2005
  - REF-GEDDES-2022
  - REF-CELLETTI-2017
  - REF-FU-2010
  evidence_type: clinical autonomic testing and computational modeling
  measured_variables:
  - MSNA
  - HR
  - BP
  - low-frequency oscillations
  reported_effect: Feedback modulation changes orthostatic dynamics and oscillatory behavior.
  parameter_implications: Supports sigmoidal target and lag structure; no single sensitivity is assumed.
  evidence_grade: E3
  confidence: medium
  limitations: This implementation does not reproduce 0.1 Hz oscillations or distinguish afferent from efferent lesions. Fu
    et al. found similar baroreflex function between their POTS and control groups, while Celletti et al. found higher—not
    lower—resting spectral BRS in JHS/EDS-HT, so a universal gain reduction is unsupported.
  modeling_implications: Use a bounded sigmoidal pressure target and separate effector gains.
  implementation_links:
  - MEC-AUT-BAROREFLEX
  validation_links:
  - VAL-PHYS-TILT
  - VAL-MATH-CONVERGENCE
  confidence_detail: moderate
- id: CLM-EDS-OI
  statement: Clinical studies support an association between hEDS/hypermobility-spectrum disorders and orthostatic intolerance
    or POTS.
  description: Clinical studies support an association between hEDS/hypermobility-spectrum disorders and orthostatic intolerance
    or POTS.
  diseases:
  - EDS
  - hEDS
  mechanism: hEDS-associated orthostatic intolerance
  references:
  - REF-ROWE-1999
  - REF-CELLETTI-2017
  - REF-GAZIT-2003
  - REF-DEWANDELE-2014
  - REF-ROMA-2018
  - REF-MILLER-POTS-2020
  evidence_type: clinical observational studies
  measured_variables:
  - orthostatic symptoms
  - HR/BP responses
  - hypermobility features
  reported_effect: Co-occurrence is observed in selected cohorts; approximately 31% of one 91-patient POTS clinic cohort met
    hEDS criteria, which is not a general-population estimate.
  parameter_implications: Supports a distinct hEDS-associated orthostatic scenario, not a causal parameter value.
  evidence_grade: E2
  confidence: low
  limitations: Selection, changing diagnostic criteria and comorbidity confounding; not all EDS subtypes are equivalent.
  modeling_implications: Label hEDS configurations exploratory and subtype-specific.
  implementation_links:
  - MEC-VASC-COMPLIANCE
  - MEC-CONNECTIVE
  validation_links:
  - VAL-EDS-DIRECTION
  confidence_detail: low-moderate
- id: CLM-EDS-VASCULAR
  statement: Human vascular-mechanics observations motivate investigation of altered vascular properties, but arterial elasticity
    is not a direct measure of venous compliance.
  description: Human vascular-mechanics observations motivate investigation of altered vascular properties, but arterial elasticity
    is not a direct measure of venous compliance.
  diseases:
  - EDS

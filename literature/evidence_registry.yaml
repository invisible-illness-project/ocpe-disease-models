  validation_links:
  - VAL-EDS-DIRECTION
  - VAL-SENSITIVITY
  confidence_detail: low for causal venous mechanism
- id: CLM-ME-PEM-KINETICS
  statement: PEM can begin hours after exertion, peak later and persist for days; it is not equivalent to immediate fatigue.
  description: PEM can begin hours after exertion, peak later and persist for days; it is not equivalent to immediate fatigue.
  diseases:
  - ME/CFS
  mechanism: Delayed post-exertional malaise and prolonged recovery
  references:
  - REF-IOM-2015
  - REF-STUSSMAN-2020
  evidence_type: consensus and qualitative patient characterization
  study_population: ME/CFS patients
  sample_size: 43
  measured_variables:
  - PEM onset
  - peak
  - duration
  - symptoms
  reported_effect: Daily-activity PEM commonly onset 12–48 h, peak near 48 h and duration 2–7 days; post-CPET onset within
    24 h and peak within 72 h for most respondents.
  parameter_implications: Constrains delay/onset/recovery time constants and scenario acceptance windows.
  evidence_grade: E3
  confidence: medium
  limitations: Recall and selection bias; does not specify a biological causal equation.
  modeling_implications: Use explicitly phenomenological delayed-stress and asymmetric recovery states.
  implementation_links:
  - MEC-RCV-PEM
  validation_links:
  - VAL-ME-PEM
  confidence_detail: moderate-high for temporal phenomenology
- id: CLM-ME-CPET
  statement: Repeated CPET studies report day-2 reductions in VO2/work in ME/CFS, with heterogeneous effect sizes and some
    conflicting replications.
  description: Repeated CPET studies report day-2 reductions in VO2/work in ME/CFS, with heterogeneous effect sizes and some
    conflicting replications.
  diseases:
  - ME/CFS
  mechanism: Reduced subsequent exertional capacity
  references:
  - REF-KELLER-2014
  - REF-SNELL-2013
  - REF-KELLER-2024
  evidence_type: repeated-CPET case series and case-control studies
  measured_variables:
  - VO2peak
  - VO2 at threshold
  - workload
  - heart rate
  reported_effect: Reported VO2peak decrements include 13.8% and 5.3%; workload decrements can be larger.
  parameter_implications: Supports capacity-state direction and a broad 0–15% VO2-like comparison band, not a fixed patient
    effect.
  evidence_grade: E3
  confidence: medium
  limitations: Spectrum bias, effort/protocol differences and heterogeneous replications.
  modeling_implications: PEM reduces subsequent functional capacity; report uncertainty rather than overfitting one study.
  implementation_links:
  - MEC-MET-CAPACITY
  - MEC-RCV-PEM
  validation_links:
  - VAL-ME-CPET
  confidence_detail: moderate
- id: CLM-ME-PRELOAD
  statement: Selected invasive-CPET cohorts show inadequate preload and, in some participants, impaired systemic oxygen extraction.
  description: Selected invasive-CPET cohorts show inadequate preload and, in some participants, impaired systemic oxygen
    extraction.
  diseases:
  - ME/CFS
  mechanism: Preload failure and impaired oxygen extraction
  references:
  - REF-JOSEPH-2021
  evidence_type: retrospective invasive clinical physiology
  sample_size: 196
  measured_variables:
  - right-atrial pressure
  - VO2
  - cardiac output
  - oxygen extraction
  reported_effect: Exercise RAP 1.9±2 versus 8.3±1.5 mmHg; selected high-flow subgroup extraction 0.74 versus 0.86–0.88.
  parameter_implications: Anchors an exploratory extraction value and preload-related sensitivity, not general prevalence.
  evidence_grade: E2
  confidence: low
  limitations: Preselected cohort and limited replication.
  modeling_implications: Keep preload and extraction mechanisms separable.
  implementation_links:
  - MEC-MET-EXTRACTION
  - MEC-VASC-POOLING
  validation_links:
  - VAL-ME-CPET
  - VAL-SENSITIVITY
  confidence_detail: low-moderate
- id: CLM-ME-CBF
  statement: ME/CFS cohorts show reduced tilt cerebral blood flow even without hypotension/tachycardia and delayed post-tilt
    recovery.
  description: ME/CFS cohorts show reduced tilt cerebral blood flow even without hypotension/tachycardia and delayed post-tilt
    recovery.
  diseases:
  - ME/CFS
  mechanism: Orthostatic cerebral hypoperfusion and delayed recovery
  references:
  - REF-VANCAMPEN-2020
  - REF-VANCAMPEN-2021
  evidence_type: controlled and observational Doppler tilt studies
  sample_size: 473
  measured_variables:
  - extracranial cerebral blood flow
  - HR
  - BP
  - cardiac index
  reported_effect: Mean end-tilt CBF reduction 26% versus 7% in controls; recovery can remain incomplete.
  parameter_implications: Supports an additional cerebral-flow state and slow recovery; 0.23 impairment is calibrated to a
    group mean.
  evidence_grade: E2
  confidence: medium
  limitations: Single-center Doppler methodology and lack of recovery-phase controls.
  modeling_implications: Do not infer CBF solely from MAP; include a phenomenological impairment and recovery lag.
  implementation_links:
  - MEC-CBF-AUTOREG
  validation_links:
  - VAL-ME-CBF
  - VAL-PHYS-RECOVERY
  confidence_detail: moderate for selected cohorts
- id: CLM-ME-METABOLISM
  statement: Metabolomic and deep-phenotyping findings motivate stress-dependent metabolic models but do not support a universal
    resting mitochondrial defect.
  description: Metabolomic and deep-phenotyping findings motivate stress-dependent metabolic models but do not support a universal
    resting mitochondrial defect.
  diseases:
  - ME/CFS
  mechanism: Dynamic metabolic dysregulation
  references:
  - REF-NAVIAUX-2016
  - REF-WALITT-2024
  - REF-WIRTH-2020
  evidence_type: metabolomics, deep phenotyping and hypothesis review

- id: MEC-CBF-CO2
  name: Bounded end-tidal-CO2 cerebral vasomotor factor
  description: 'Stage 1 declared this pathway a deliberate omission (the former CO2-omission mechanism
    entry, removed from the registry): CO2 materially regulates cerebral blood flow but the model then had
    no CO2 input. Stage 1.1 implements it as an explicit per-segment end-tidal-CO2 input acting on the
    cerebral-flow target through a bounded exponential reactivity factor (0.035/mmHg, clipped to +/-15 mmHg
    about the 40 mmHg reference). Deliberate consequences: no posture-inferred hypocapnia (tilt never changes
    ETCO2), and the declared end-tidal value is consumed directly with no ETCO2-to-PaCO2 correction.'
  diseases:
  - shared
  - POTS
  - ME/CFS
  - Long COVID
  claims:
  - CLM-CBF-CO2
  classification: phenomenological_mechanistic_hybrid
  maturity: M3
  status: implemented
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient.rhs
  parameters:
  - PAR-END-TIDAL-CO2-REFERENCE
  - PAR-CEREBRAL-CO2-REACTIVITY
  - PAR-CEREBRAL-CO2-EXTRAPOLATION-LIMIT
  tests:
  - VAL-PHYS-CBF-CO2
  - VAL-SENSITIVITY
  confidence: moderate for direction, low for patient-level magnitude
  limitations: End-tidal CO2 is an approximate, biased surrogate of arterial PCO2 (including under orthostasis);
    no CO2 state, ventilation dynamics, or hypocapnic hyperpnea feedback is modeled; the clip is a modeling
    guard, not physiology.
  equations:
  - EQ-CBF-003

schema_version: '1.0'
mechanisms:
- id: MEC-CV-VOLUME
  name: Conservative five-compartment hemodynamics
  description: Arterial, central-venous, splanchnic-venous, lower-limb-venous and residual other-systemic
    venous stressed volumes exchange through cardiac output, regional arterial flows and regional venous
    returns; the five volume derivatives telescope exactly. The Stage 1.1 residual bed realizes a 25/25/50
    splanchnic/lower-limb/other baseline flow partition at unchanged total conductance.
  diseases:
  - shared
  claims:
  - CLM-CV-HEMODYNAMICS
  - CLM-CV-VENOUS-RETURN
  - CLM-CV-STRESSED-VOLUME
  - CLM-ORTHO-LOWER-LIMB
  classification: mechanistic_approximation
  maturity: M3
  status: implemented
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient.rhs
  parameters:
  - PAR-ARTERIAL-COMPLIANCE
  - PAR-CENTRAL-VENOUS-COMPLIANCE
  - PAR-SPLANCHNIC-VENOUS-COMPLIANCE
  - PAR-LOWER-LIMB-VENOUS-COMPLIANCE
  - PAR-OTHER-SYSTEMIC-VENOUS-COMPLIANCE
  - PAR-SPLANCHNIC-ARTERIAL-RESISTANCE
  - PAR-LOWER-LIMB-ARTERIAL-RESISTANCE
  - PAR-OTHER-SYSTEMIC-ARTERIAL-RESISTANCE
  - PAR-SPLANCHNIC-VENOUS-RESISTANCE
  - PAR-LOWER-LIMB-VENOUS-RESISTANCE
  - PAR-OTHER-SYSTEMIC-VENOUS-RESISTANCE
  - PAR-ARTERIAL-VOLUME-INITIAL
  - PAR-CENTRAL-VENOUS-VOLUME-INITIAL
  - PAR-SPLANCHNIC-VENOUS-PRESSURE-INITIAL
  - PAR-LOWER-LIMB-VENOUS-PRESSURE-INITIAL
  - PAR-OTHER-SYSTEMIC-VENOUS-PRESSURE-INITIAL
  - PAR-BLOOD-VOLUME-FACTOR
  - PAR-STROKE-VOLUME-MAX
  - PAR-STROKE-VOLUME-HALF-VOLUME
  - PAR-CONTRACTILITY-SYMPATHETIC-GAIN
  tests:
  - VAL-MATH-CONSERVATION
  - VAL-MATH-CONVERGENCE
  - VAL-PHYS-BASELINE
  confidence: moderate
  limitations: Beat-averaged, linear compliances, nonnegative clipped flows, no pulsatile heart, no unstressed-volume
    state, one lumped residual other-systemic bed and no independent patient identification.
  equations:
  - EQ-CV-001
  - EQ-CV-002
  - EQ-CV-003
  - EQ-CV-004
  - EQ-CV-005
- id: MEC-AUT-BAROREFLEX
  name: Dual-sensor weighted baroreflex with distinct autonomic effector states
  description: Separate aortic-arch and carotid-sinus pressure sensors, each hydrostatically corrected at its
    own height by the shared sine-angle geometry, feed an integrated weighted pressure-error sigmoid target
    (weights validated to sum to 1); the target drives separate first-order cardiac-sympathetic,
    vascular-sympathetic and vagal states with distinct lags; the vagal target is the complement of the
    baroreflex target. Brain-level pressure is not a baroreflex sensor.
  diseases:
  - shared
  - POTS
  - hEDS
  - ME/CFS
  - Long COVID
  claims:
  - CLM-POTS-BAROREFLEX
  - CLM-CV-HEMODYNAMICS
  - CLM-POTS-CRITERIA
  - CLM-LC-HETEROGENEITY
  - CLM-AUT-VAGAL-FAST
  - CLM-AUT-SYMPATHETIC-PATHWAYS
  - CLM-AUT-DELAYS
  - CLM-AUT-DUAL-SENSOR
  classification: mechanistic_approximation
  maturity: M3
  status: implemented
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient.rhs
  parameters:
  - PAR-AORTIC-BAROREFLEX-PRESSURE-SETPOINT
  - PAR-CAROTID-BAROREFLEX-PRESSURE-SETPOINT
  - PAR-AORTIC-BAROREFLEX-PRESSURE-SCALE
  - PAR-CAROTID-BAROREFLEX-PRESSURE-SCALE
  - PAR-AORTIC-BAROREFLEX-WEIGHT
  - PAR-CAROTID-BAROREFLEX-WEIGHT
  - PAR-AORTIC-BARORECEPTOR-HEIGHT
  - PAR-CAROTID-BARORECEPTOR-HEIGHT
  - PAR-CARDIAC-SYMPATHETIC-TIME-CONSTANT
  - PAR-VASCULAR-SYMPATHETIC-TIME-CONSTANT
  - PAR-VAGAL-TIME-CONSTANT
  - PAR-HEART-RATE-REST
  - PAR-HEART-RATE-CARDIAC-SYMPATHETIC-GAIN
  - PAR-HEART-RATE-VAGAL-GAIN
  - PAR-EXERCISE-HEART-RATE-GAIN
  tests:
  - VAL-PHYS-TILT
  - VAL-PHYS-TILT-ANGLE
  - VAL-POTS-NEUROPATHIC
  - VAL-LC-AUTONOMIC
  - VAL-MATH-CONVERGENCE
  confidence: moderate
  limitations: First-order lags approximate distributed neural and neuroeffector dynamics; no MSNA state,
    afferent-lesion distinction, pure delays or 0.1 Hz resonance representation; the 0.25/0.75 integration
    weights are computational assumptions, not measurements of relative afferent contributions.
  equations:
  - EQ-AUT-001
  - EQ-AUT-002
  - EQ-AUT-003
- id: MEC-VASC-POOLING
  name: Regional orthostatic venous-return opposition and pooling
  description: Upright posture adds hydrostatic sine-angle pressure opposition (lumped regional heights
    times sin(tilt angle)) to splanchnic, lower-limb and residual other-systemic venous return and
    redistributes conserved stressed volume across the five compartments.
  diseases:
  - POTS
  - hEDS
  - ME/CFS
  - Long COVID
  claims:
  - CLM-POTS-POOLING
  - CLM-CV-HEMODYNAMICS

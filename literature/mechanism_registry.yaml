  - VAL-PHYS-TILT-ANGLE
  - VAL-PHYS-GRADED-TILT
  - VAL-POTS-NEUROPATHIC
  - VAL-EDS-DIRECTION
  confidence: moderate for direction, low for magnitude
  limitations: Lumped regional heights times sin(tilt angle) are not measured hydrostatic columns or regional
    pooling fluxes; lower body negative pressure and tilt are not interchangeable stressors.
  equations:
  - EQ-ORT-001
  - EQ-ORT-002
  - EQ-CV-003
- id: MEC-ORTHO-HYDROSTATIC
  name: Hydrostatic sine-angle posture geometry
  description: A single resolved tilt angle in [0, 90] degrees (legacy normalized upright input migrates as
    theta = arcsin(u)) drives all hydrostatic corrections as 0.7356 mmHg/cm times lumped height times
    sin(angle); during a transition only the angle is linearly interpolated while all other inputs stay
    piecewise constant. The geometry is shared by the regional venous returns, the aortic and carotid
    baroreceptor pressures, and the brain-level arterial pressure.
  diseases:
  - shared
  - POTS
  - hEDS
  - ME/CFS
  - Long COVID
  claims:
  - CLM-ORTHO-HYDROSTATIC
  - CLM-ORTHO-GRADED-TILT
  classification: mechanistic_approximation
  maturity: M3
  status: implemented
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  parameters:
  - PAR-SPLANCHNIC-HYDROSTATIC-HEIGHT
  - PAR-LOWER-LIMB-HYDROSTATIC-HEIGHT
  - PAR-OTHER-SYSTEMIC-HYDROSTATIC-HEIGHT
  - PAR-AORTIC-BARORECEPTOR-HEIGHT
  - PAR-CAROTID-BARORECEPTOR-HEIGHT
  - PAR-BRAIN-HYDROSTATIC-HEIGHT
  tests:
  - VAL-PHYS-TILT-ANGLE
  - VAL-PHYS-GRADED-TILT
  confidence: moderate for the sine-angle structure, low for the lumped heights
  limitations: Lumped heights are regional geometry, not measured hydrostatic columns; angles beyond [0, 90]
    degrees and inverted postures are out of scope; no venous-valve or column-collapse dynamics.
  equations:
  - EQ-ORT-002
- id: MEC-VASC-CONSTRICTION
  name: Vascular-sympathetic regional resistance modulation

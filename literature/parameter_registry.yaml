schema_version: '1.0'
registry_policy:
  value_interpretation: Nominal values are executable research assumptions unless explicitly described
    otherwise. Literature supports structure, direction, or group-level constraints—not automatic patient
    validity.
  range_interpretation: Supported ranges define deterministic sensitivity scenarios, not probability distributions
    or synthetic patient cohorts.
parameters:
- id: PAR-ARTERIAL-COMPLIANCE
  name: arterial compliance
  symbol: arterial_compliance
  model_field: arterial_compliance
  healthy_reference_value: 1.5
  value: 1.5
  units: mL/mmHg
  source: Healthy reference computational configuration; cited references provide structural, directional,
    or group-level context, not a direct measurement of this nominal value.
  evidence_claims:
  - CLM-CV-HEMODYNAMICS
  - CLM-CV-STRESSED-VOLUME
  estimation_method: Explicit computational operating-point choice; not estimated from an individual patient.
  supported_range:
    min: 1.0
    max: 2.0
    status: computational sensitivity/scenario range; not a population reference interval
  uncertainty:
    qualitative: high for absolute patient-level value; direction and units are separately reviewed
    sensitivity_required: true
  calibration:
    required_for_patient_use: true
    current_status: research demonstration only; no patient-specific calibration performed
  dependencies:
    equations:
    - EQ-CV-001
    validation:
    - VAL-MATH-CONSERVATION
    - VAL-PHYS-BASELINE
  phenotype_values: {}
  provenance: Retained as ModelParameters.arterial_compliance through the Stage 1 four-compartment revision
    of the shared model; defaults and all YAML overrides are audited against this record.
  references:
  - REF-GEDDES-2022
  - REF-HELDT-2002
  - REF-OLUFSEN-2005
  description: Executable arterial compliance used by the shared reduced-order model; see linked equations
    and phenotype overrides.
  nominal_value: 1.5
  population: No individual patient population; computational healthy reference with phenotype-specific
    scenario overrides. Cited study populations are recorded in the linked evidence and reference registries.
  value_class: assumed_computational_operating_point

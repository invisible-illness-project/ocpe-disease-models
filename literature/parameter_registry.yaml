- id: PAR-DEPENDENT-VENOUS-STIFFENING
  name: dependent venous second-order stiffening coefficient
  symbol: dependent_venous_stiffening_mmHg_per_mL2
  model_field: dependent_venous_stiffening_mmHg_per_mL2
  healthy_reference_value: 0.0001
  value: 0.0001
  units: mmHg/mL^2
  source: Stage 1.3 explicit structural modeling assumption; cited human tilt observations support bounded
    angle-dependent pooling but do not directly measure this lumped coefficient.
  evidence_claims:
  - CLM-ORTHO-GRADED-TILT
  - CLM-CV-VENOUS-RETURN
  estimation_method: Deterministic scenario calibration of second-order elastance above the supine stressed
    volume. Zero recovers the Stage 1.2 linear law; the nominal value is not an independently identified
    tissue property.
  supported_range:
    min: 0.0
    max: 0.0002
    status: computational sensitivity/scenario range; not a population reference interval
  uncertainty:
    qualitative: high for absolute value and for the quadratic functional form; equation structure remains
      a research assumption
    sensitivity_required: true
  calibration:
    required_for_patient_use: true
    current_status: research demonstration only; no patient-specific calibration performed
  dependencies:
    equations:
    - EQ-CV-001
    validation:
    - VAL-MATH-CONSERVATION
    - VAL-PHYS-GRADED-TILT
    - VAL-SENSITIVITY
  phenotype_values: {}
  provenance: Introduced in Stage 1.3 because the linear dependent-venous pressure law could not satisfy
    the preserved 60-degree and 70-degree group constraints simultaneously without excessive compensatory
    gains. The term changes no state derivative conservation identity and is zero at and below each bed’s
    scaled supine stressed volume.
  references:
  - REF-ZAIDI-2000
  - REF-ROWELL-1972
  - REF-HELDT-2002
  description: One-sided quadratic pressure contribution for pooled splanchnic and lower-limb stressed
    volume, representing limited dependent venous distensibility.
  nominal_value: 0.0001
  population: No individual patient population; computational healthy reference with phenotype-specific
    scenario overrides.
  value_class: calibrated_or_assumed_requires_validation

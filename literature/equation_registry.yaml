schema_version: '1.0'
equations:
- id: EQ-CV-001
  expression: P_a=V_a/C_a; P_c=V_c/C_c; P_s=V_s/C_s+k_d*max(0,V_s-P_s0*C_s*f_bv)^2; P_l=V_l/C_l+k_d*max(0,V_l-P_l0*C_l*f_bv)^2; P_o=V_o/C_o
  description: Five conservative-compartment pressure relations with one-sided quadratic elastance for dependent splanchnic and lower-limb stressed volumes above their scaled supine volumes.
  state_variables:
  - arterial_volume
  - central_venous_volume
  - splanchnic_venous_volume
  - lower_limb_venous_volume
  - other_systemic_venous_volume
  parameters:
  - PAR-ARTERIAL-COMPLIANCE
  - PAR-CENTRAL-VENOUS-COMPLIANCE
  - PAR-SPLANCHNIC-VENOUS-COMPLIANCE
  - PAR-LOWER-LIMB-VENOUS-COMPLIANCE
  - PAR-OTHER-SYSTEMIC-VENOUS-COMPLIANCE
  - PAR-DEPENDENT-VENOUS-STIFFENING
  - PAR-BLOOD-VOLUME-FACTOR
  units: mmHg
  physiological_interpretation: Linear pressure relations remain in arterial, central-venous and residual beds; dependent beds add bounded-distensibility pressure only when pooling exceeds the scaled supine stressed volume. The constitutive term does not alter volume conservation.
  claims:
  - CLM-CV-HEMODYNAMICS
  - CLM-CV-STRESSED-VOLUME
  - CLM-CV-VENOUS-RETURN
  - CLM-ORTHO-GRADED-TILT
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation.
  - The one-sided quadratic term is an explicit Stage 1.3 structural modeling assumption, not an independently measured tissue property; k_d=0 recovers the Stage 1.2 linear law.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-MATH-CONSERVATION
  - VAL-PHYS-GRADED-TILT
  provenance: Stage 1.3 constitutive revision after exact Stage 1.2 baseline reproduction and failure of the linear law to satisfy the preserved multi-angle scenario constraints simultaneously.
- id: EQ-CV-002
  expression: Q_sa=max(0,(P_a-P_s)/R_sa_eff); Q_la=max(0,(P_a-P_l)/R_la_eff); Q_oa=max(0,(P_a-P_o)/R_oa_eff)
  description: Resistance-driven regional arterial inflows to the splanchnic, lower-limb and residual
    other-systemic beds.
  state_variables:
  - arterial_volume
  - splanchnic_venous_volume
  - lower_limb_venous_volume
  - other_systemic_venous_volume
  parameters:
  - PAR-SPLANCHNIC-ARTERIAL-RESISTANCE
  - PAR-LOWER-LIMB-ARTERIAL-RESISTANCE
  - PAR-OTHER-SYSTEMIC-ARTERIAL-RESISTANCE
  units: mL/s
  physiological_interpretation: Resistance-driven regional arterial inflows to the splanchnic, lower-limb
    and residual other-systemic beds.
  claims:
  - CLM-CV-HEMODYNAMICS
  - CLM-ORTHO-SPLANCHNIC
  - CLM-ORTHO-LOWER-LIMB
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  - Retrograde regional arterial flow is excluded by the nonnegative floor.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-PHYS-BASELINE
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-CV-003
  expression: dV_a/dt=Q_co-(Q_sa+Q_la+Q_oa); dV_c/dt=(Q_sv+Q_lv+Q_ov)-Q_co; dV_s/dt=Q_sa-Q_sv; dV_l/dt=Q_la-Q_lv;
    dV_o/dt=Q_oa-Q_ov; d(V_a+V_c+V_s+V_l+V_o)/dt=0
  description: 'Five-volume conservation: the arterial, central-venous, splanchnic-venous, lower-limb-venous
    and residual other-systemic venous derivatives telescope exactly.'
  state_variables:
  - arterial_volume
  - central_venous_volume
  - splanchnic_venous_volume
  - lower_limb_venous_volume
  - other_systemic_venous_volume
  parameters: []
  units: mL/s
  physiological_interpretation: 'Five-volume conservation: the arterial, central-venous, splanchnic-venous,
    lower-limb-venous and residual other-systemic venous derivatives telescope exactly.'
  claims:
  - CLM-CV-HEMODYNAMICS
  - CLM-CV-VENOUS-RETURN
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-MATH-CONSERVATION
  - VAL-MATH-CONVERGENCE
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-CV-004
  expression: SV=SV_max*max(0.2,1+k_E(S_card-0.5))*V_c/(V_c+K_SV)
  description: Preload- and cardiac-sympathetic-dependent stroke-volume approximation.
  state_variables:
  - central_venous_volume
  - cardiac_sympathetic_state
  parameters:
  - PAR-STROKE-VOLUME-MAX
  - PAR-STROKE-VOLUME-HALF-VOLUME
  - PAR-CONTRACTILITY-SYMPATHETIC-GAIN
  units: mL
  physiological_interpretation: Preload- and cardiac-sympathetic-dependent stroke-volume approximation.
  claims:
  - CLM-CV-HEMODYNAMICS
  - CLM-POTS-POOLING
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-PHYS-TILT
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-CV-005
  expression: Q_co=(HR/60)*SV
  description: Cardiac output from heart rate and stroke volume.
  state_variables:
  - central_venous_volume
  - cardiac_sympathetic_state
  - vagal_state
  parameters: []
  units: mL/s
  physiological_interpretation: Cardiac output from heart rate and stroke volume.
  claims:
  - CLM-CV-HEMODYNAMICS
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-PHYS-BASELINE
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-VASC-001
  expression: R_sa_eff=R_sa*(1+g_sa(S_vasc-0.5)); R_la_eff=R_la*(1+g_la(S_vasc-0.5))*(1-k_ex*e); R_oa_eff=R_oa*(1+g_oa(S_vasc-0.5))
  description: Effective regional arterial resistances modulated separately by the vascular-sympathetic
    state and exertion.
  state_variables:
  - vascular_sympathetic_state
  parameters:
  - PAR-SPLANCHNIC-ARTERIAL-RESISTANCE
  - PAR-LOWER-LIMB-ARTERIAL-RESISTANCE
  - PAR-OTHER-SYSTEMIC-ARTERIAL-RESISTANCE
  - PAR-SPLANCHNIC-RESISTANCE-SYMPATHETIC-GAIN
  - PAR-LOWER-LIMB-RESISTANCE-SYMPATHETIC-GAIN
  - PAR-OTHER-SYSTEMIC-RESISTANCE-SYMPATHETIC-GAIN
  - PAR-EXERCISE-RESISTANCE-REDUCTION
  units: mmHg s/mL
  physiological_interpretation: Effective regional arterial resistances modulated separately by the vascular-sympathetic
    state and exertion.
  claims:
  - CLM-POTS-POOLING
  - CLM-POTS-PHENOTYPES
  - CLM-AUT-SYMPATHETIC-PATHWAYS
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  - Exercise vasodilation applies only to the lower-limb arterial path.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-POTS-NEUROPATHIC
  - VAL-SENSITIVITY
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-ORT-001
  expression: Q_sv=max(0,(P_s-P_c-dP_hydro(h_s))/R_sv); Q_lv=max(0,(P_l-P_c-dP_hydro(h_l))/R_lv_eff)+Q_pump;
    Q_ov=max(0,(P_o-P_c-dP_hydro(h_o))/R_ov)
  description: Regional venous returns from the splanchnic, lower-limb and residual other-systemic beds with
    hydrostatic sine-angle pressure opposition (EQ-ORT-002) plus the muscle-pump contribution.
  state_variables:
  - central_venous_volume
  - splanchnic_venous_volume
  - lower_limb_venous_volume
  - other_systemic_venous_volume
  parameters:
  - PAR-SPLANCHNIC-HYDROSTATIC-HEIGHT
  - PAR-LOWER-LIMB-HYDROSTATIC-HEIGHT
  - PAR-OTHER-SYSTEMIC-HYDROSTATIC-HEIGHT
  - PAR-SPLANCHNIC-VENOUS-RESISTANCE
  - PAR-LOWER-LIMB-VENOUS-RESISTANCE
  - PAR-OTHER-SYSTEMIC-VENOUS-RESISTANCE
  units: mL/s
  physiological_interpretation: Regional venous returns with height-times-sine hydrostatic opposition plus
    the muscle-pump contribution.
  claims:
  - CLM-POTS-POOLING
  - CLM-CV-HEMODYNAMICS
  - CLM-ORTHO-SPLANCHNIC
  - CLM-ORTHO-LOWER-LIMB
  - CLM-ORTHO-HYDROSTATIC
  assumptions:
  - Hydrostatic opposition is 0.7356 mmHg/cm times the lumped regional height times sin(tilt angle); at 0
    degrees every hydrostatic term is exactly zero; reverse venous flow is excluded.
  applicability_limits:
  - Lumped per-region geometry, not a measured hydrostatic column or regional pooling flux; LBNP and tilt
    are not interchangeable stressors.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-PHYS-TILT
  - VAL-PHYS-TILT-ANGLE
  - VAL-PHYS-GRADED-TILT
  - VAL-POTS-NEUROPATHIC
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-ORT-002
  expression: dP_hydro(h)=0.7356*h*sin(theta); theta=tilt_angle_deg in [0,90] (legacy upright u migrates as
    theta=arcsin(u)); during a transition only theta is linearly interpolated
  description: Shared hydrostatic sine-angle pressure correction for a lumped height h (cm) under the resolved
    tilt angle; used by the regional venous returns, the aortic/carotid baroreceptor pressures and the
    brain-level arterial pressure.
  state_variables: []
  parameters:
  - PAR-SPLANCHNIC-HYDROSTATIC-HEIGHT
  - PAR-LOWER-LIMB-HYDROSTATIC-HEIGHT
  - PAR-OTHER-SYSTEMIC-HYDROSTATIC-HEIGHT
  - PAR-AORTIC-BARORECEPTOR-HEIGHT
  - PAR-CAROTID-BARORECEPTOR-HEIGHT
  - PAR-BRAIN-HYDROSTATIC-HEIGHT
  units: mmHg
  physiological_interpretation: Hydrostatic pressure correction scales with vertical heart-to-site height
    and the sine of the tilt angle; replaces the Stage 1 fixed mmHg gravity offsets.
  claims:
  - CLM-ORTHO-HYDROSTATIC
  - CLM-ORTHO-GRADED-TILT
  assumptions:
  - 0.7356 mmHg/cm conversion; lumped heights are regional geometry, not measured hydrostatic columns;
    angle-only linear transitions with all other inputs piecewise constant.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated; angle restricted to [0, 90]
    degrees (supine-to-upright head-up tilt).
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-PHYS-TILT-ANGLE
  - VAL-PHYS-GRADED-TILT
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-MP-001
  expression: Q_pump=f_pump*SV_pump*eta_pump*m*V_l/(V_l+K_pump)
  description: Rhythmic muscle-pump flow transferring lower-limb venous volume toward the central compartment.
  state_variables:
  - lower_limb_venous_volume
  parameters:
  - PAR-MUSCLE-PUMP-STROKE-VOLUME
  - PAR-MUSCLE-PUMP-FREQUENCY
  - PAR-MUSCLE-PUMP-EFFECTIVENESS
  - PAR-MUSCLE-PUMP-HALF-VOLUME
  units: mL/s
  physiological_interpretation: Rhythmic muscle-pump flow transferring lower-limb venous volume toward
    the central compartment.
  claims:
  - CLM-MUSCLE-PUMP
  - CLM-MUSCLE-PUMP-LIMITS
  assumptions:
  - Rhythmic muscle activity m is an explicit protocol input; the pump moves conserved stressed volume
    and cannot create blood.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  - Pump magnitude is a computational assumption; the pump is not obligatory for exercise cardiac output.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-MATH-CONSERVATION
  - VAL-SENSITIVITY
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-MP-002
  expression: R_lv_eff=R_lv*(1+k_contract*c)
  description: Sustained-contraction multiplier impeding lower-limb venous outflow.
  state_variables:
  - lower_limb_venous_volume
  parameters:
  - PAR-SUSTAINED-CONTRACTION-RESISTANCE-GAIN
  - PAR-LOWER-LIMB-VENOUS-RESISTANCE
  units: mmHg s/mL
  physiological_interpretation: Sustained-contraction multiplier impeding lower-limb venous outflow.
  claims:
  - CLM-MUSCLE-SUSTAINED
  assumptions:
  - Sustained contraction c is an explicit protocol input distinct from rhythmic activity and exertion.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  - The calibrated gain is assumed, not a direct human measurement.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-MATH-CONSERVATION
  - VAL-SENSITIVITY
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-AUT-001
  expression: P_ao=max(0,P_a-dP_hydro(h_ao)); P_ca=max(0,P_a-dP_hydro(h_ca)); B=1/(1+exp(-clip(w_ao*(P_set_ao-P_ao)/sigma_ao+w_ca*(P_set_ca-P_ca)/sigma_ca,-40,40)))
  description: Bounded baroreflex target integrating separate aortic-arch and carotid-sinus pressure errors,
    each hydrostatically corrected at its own sensor height, with validated weights summing to 1.
  state_variables:
  - arterial_volume
  parameters:
  - PAR-AORTIC-BAROREFLEX-PRESSURE-SETPOINT
  - PAR-CAROTID-BAROREFLEX-PRESSURE-SETPOINT
  - PAR-AORTIC-BAROREFLEX-PRESSURE-SCALE
  - PAR-CAROTID-BAROREFLEX-PRESSURE-SCALE
  - PAR-AORTIC-BAROREFLEX-WEIGHT
  - PAR-CAROTID-BAROREFLEX-WEIGHT
  - PAR-AORTIC-BARORECEPTOR-HEIGHT
  - PAR-CAROTID-BARORECEPTOR-HEIGHT
  units: '1'
  physiological_interpretation: Dual-pressure weighted baroreflex target, increasing as either sensor pressure
    falls; the weights are computational assumptions, not measurements of relative afferent contributions.
  claims:
  - CLM-POTS-BAROREFLEX
  - CLM-AUT-DUAL-SENSOR
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation;
    aortic and carotid weights are validated to sum to 1 within 1e-6; sensor errors are clipped at +/-40
    before the sigmoid.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated; brain-level pressure is not
    a baroreflex sensor.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-PHYS-TILT
  - VAL-PHYS-TILT-ANGLE
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-AUT-002
  expression: dS_card/dt=(B-S_card)/tau_Sc; dS_vasc/dt=(B-S_vasc)/tau_Sv; dVag/dt=(1-B-Vag)/tau_Vag
  description: Distinct first-order cardiac-sympathetic, vascular-sympathetic and vagal effector states
    tracking the shared baroreflex target with separate lags.
  state_variables:
  - cardiac_sympathetic_state
  - vascular_sympathetic_state
  - vagal_state
  parameters:
  - PAR-CARDIAC-SYMPATHETIC-TIME-CONSTANT
  - PAR-VASCULAR-SYMPATHETIC-TIME-CONSTANT
  - PAR-VAGAL-TIME-CONSTANT
  units: 1/s
  physiological_interpretation: Distinct first-order cardiac-sympathetic, vascular-sympathetic and vagal
    effector states tracking the shared baroreflex target with separate lags.
  claims:
  - CLM-POTS-BAROREFLEX
  - CLM-CV-HEMODYNAMICS
  - CLM-AUT-VAGAL-FAST
  - CLM-AUT-SYMPATHETIC-PATHWAYS
  - CLM-AUT-DELAYS
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  - First-order lags approximate distributed neural dynamics; no pure delays or afferent-lesion distinctions.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-MATH-CONVERGENCE
  - VAL-PHYS-TILT
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-AUT-003
  expression: HR=clip(HR_0+g_Sc*(S_card-0.5)+g_Vag*(0.5-Vag)+g_ex*e*C,30,220)
  description: Heart rate from rest, distinct cardiac-sympathetic and vagal states, and capacity-limited
    exertion.
  state_variables:
  - cardiac_sympathetic_state
  - vagal_state
  - pem_severity
  parameters:
  - PAR-HEART-RATE-REST
  - PAR-HEART-RATE-CARDIAC-SYMPATHETIC-GAIN
  - PAR-HEART-RATE-VAGAL-GAIN
  - PAR-EXERCISE-HEART-RATE-GAIN
  units: bpm
  physiological_interpretation: Heart rate from rest, distinct cardiac-sympathetic and vagal states, and
    capacity-limited exertion.
  claims:
  - CLM-POTS-BAROREFLEX
  - CLM-POTS-HYPERADRENERGIC
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-POTS-HYPER
  - VAL-POTS-NEUROPATHIC
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-CBF-001
  expression: P_brain=max(0,P_a-dP_hydro(h_brain)); CPP=max(0,P_brain-P_out); x=CPP/CPP_ref; CFI_pressure=x/(s_AR+(1-s_AR)*x)
  description: Brain-level cerebral perfusion pressure (brain arterial pressure minus the fixed effective
    cerebral outflow pressure) with the bounded autoregulation curve.
  state_variables:
  - arterial_volume
  parameters:
  - PAR-BRAIN-HYDROSTATIC-HEIGHT
  - PAR-CEREBRAL-OUTFLOW-PRESSURE
  - PAR-CEREBRAL-REFERENCE-PERFUSION-PRESSURE
  - PAR-CEREBRAL-AUTOREGULATION-RESIDUAL-SLOPE
  units: '1'
  physiological_interpretation: Brain-level cerebral perfusion pressure with a bounded autoregulation curve;
    the fixed 5 mmHg effective outflow pressure is neither thoracic central venous pressure nor a separately
    resolved intracranial pressure.
  claims:
  - CLM-ME-CBF
  - CLM-CBF-CPP
  - CLM-CBF-OUTFLOW
  - CLM-CBF-AUTOREG-DYNAMIC
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  - Normalized proxy; no intracranial-pressure state, venous-sinus collapse dynamics or territory-resolved
    content.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-ME-CBF
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-CBF-002
  expression: dCFI/dt=(CFI_target-CFI)/tau_CBF; tau_CBF=tau_decline if target<CFI else tau_recovery
  description: Asymmetric cerebral-flow decline and recovery.
  state_variables:
  - cerebral_flow_index
  parameters:
  - PAR-CEREBRAL-DECLINE-TIME-CONSTANT
  - PAR-CEREBRAL-RECOVERY-TIME-CONSTANT
  units: 1/s
  physiological_interpretation: Asymmetric cerebral-flow decline and recovery.
  claims:
  - CLM-ME-CBF
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-ME-CBF
  - VAL-PHYS-RECOVERY
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-CBF-003
  expression: f_CO2=exp(k_CO2*clip(ETCO2-ETCO2_ref,-D_CO2,D_CO2)); CFI_target=CFI_pressure*f_CO2*max(0,1-beta*sin(theta));
    ETCO2 defaults to ETCO2_ref when a segment omits it
  description: Cerebral-flow target assembly combining the pressure-autoregulation target (EQ-CBF-001), a
    bounded exponential end-tidal-CO2 factor, and the orthostatic impairment factor.
  state_variables: []
  parameters:
  - PAR-END-TIDAL-CO2-REFERENCE
  - PAR-CEREBRAL-CO2-REACTIVITY
  - PAR-CEREBRAL-CO2-EXTRAPOLATION-LIMIT
  - PAR-CEREBRAL-ORTHOSTATIC-IMPAIRMENT
  units: '1'
  physiological_interpretation: Hypocapnia reduces the cerebral-flow target through a bounded exponential
    end-tidal-CO2 factor; the +/-15 mmHg clip bounds extrapolation outside the evidence-supported range.
  claims:
  - CLM-CBF-CO2
  assumptions:
  - End-tidal CO2 is an explicit per-segment protocol input consumed directly (no ETCO2-to-PaCO2 correction);
    no posture-inferred hypocapnia; upright segments that omit ETCO2 stay at the 40 mmHg reference.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated; end-tidal CO2 is an approximate,
    biased surrogate of arterial PCO2; no CO2 state or ventilation dynamics are modeled.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-PHYS-CBF-CO2
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-MET-001
  expression: C=max(0.05,C_0*(1-k_C*PEM))
  description: PEM-dependent reduction of normalized exertional capacity.
  state_variables:
  - pem_severity
  parameters:
  - PAR-BASELINE-METABOLIC-CAPACITY
  - PAR-PEM-CAPACITY-PENALTY
  units: '1'
  physiological_interpretation: PEM-dependent reduction of normalized exertional capacity.
  claims:
  - CLM-ME-CPET
  - CLM-LC-CPET
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-ME-CPET
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-MET-002
  expression: E_a-v=clip(E_0*(1-k_EO*PEM),0,0.99); F=C*E_a-v/E_ref
  description: Extraction and normalized functional capacity with an explicit reference extraction parameter.
  state_variables:
  - pem_severity
  parameters:
  - PAR-OXYGEN-EXTRACTION-FRACTION
  - PAR-PEM-EXTRACTION-PENALTY
  - PAR-FUNCTIONAL-CAPACITY-REFERENCE-EXTRACTION
  units: '1'
  physiological_interpretation: Extraction and normalized functional capacity with an explicit reference
    extraction parameter.
  claims:
  - CLM-LC-EXTRACTION
  - CLM-ME-PRELOAD
  assumptions:
  - Beat-averaged deterministic reduced-order representation; parameters are constant within a simulation.
  applicability_limits:
  - Research demonstration only; not patient-specific or clinically validated.
  implementation: src/ocpe_disease_models/models/shared/model.py::ComputationalPatient
  validation:
  - VAL-LC-EXTRACTION
  provenance: literature-grounded reduced-order specification; see claims and parameter registry
- id: EQ-RCV-001
  expression: dL/dt=(e/C-L)/tau_L
  description: Exertional load accumulates relative to current capacity and clears with a first-order
    lag.
  state_variables:
  - exertional_load
  - pem_severity
  parameters:
  - PAR-EXERTIONAL-LOAD-TIME-CONSTANT
  units: 1/s
  physiological_interpretation: Exertional load accumulates relative to current capacity and clears with
    a first-order lag.
  claims:
